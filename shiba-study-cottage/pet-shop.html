<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3eddf">
  <meta name="description" content="在像素宠物商店认识新伙伴，为它取名，再一起回家。">
  <title>宠物商店 · 柴柴学习小屋</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="pet-shop.css?v=black-puppy-adoption-1">
  <link rel="stylesheet" href="pet-shop-compact.css?v=2">
</head>
<body>
  <div class="sky" aria-hidden="true"><span class="cloud cloud-one"></span><span class="cloud cloud-two"></span></div>
  <main class="shop-shell">
    <header class="shop-topbar">
      <a href="../index.html" class="back-link" aria-label="返回主页"><span aria-hidden="true">←</span> 返回主页</a>
    </header>

    <section class="shop-front" aria-labelledby="shop-title">
      <div class="awning" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="shop-heading">
        <h1 id="shop-title">宠物商店</h1>
        <p class="intro">从幼年开始，一起慢慢长大。</p>
      </div>

      <div class="shop-interior">
        <div class="pet-grid" role="list" aria-label="宠物品种">
          <article class="pet-card available selected" role="listitem" data-pet="red-shiba">
            <button class="pet-card-action" type="button" data-breed="red-shiba" aria-label="选择赤柴幼犬" aria-pressed="true"></button>
            <div class="display-window"><div class="window-glow"></div><canvas class="pet-sprite" data-sprite="red" width="96" height="96" aria-label="赤柴幼犬像素形象" role="img"></canvas><div class="window-floor"></div></div>
            <div class="card-content"><div class="card-title"><h2>赤柴犬</h2><span class="pet-status available-status">可以领养</span></div><p>好奇活泼的小小探险家。</p></div>
          </article>
          <article class="pet-card available" role="listitem" data-pet="black-shiba">
            <button class="pet-card-action" type="button" data-breed="black-shiba" aria-label="选择黑柴幼犬" aria-pressed="false"></button>
            <div class="display-window"><div class="window-glow"></div><canvas class="pet-sprite" data-sprite="black" width="96" height="96" aria-label="黑柴幼犬像素形象" role="img"></canvas><div class="window-floor"></div></div>
            <div class="card-content"><div class="card-title"><h2>黑柴犬</h2><span class="pet-status available-status">可以领养</span></div><p>乌黑的毛色，暖暖的小眉毛。</p></div>
          </article>
          <article class="pet-card coming" role="listitem" aria-label="布偶猫，未到店，暂不可领养">
            <div class="display-window"><div class="window-glow"></div><canvas class="pet-sprite" data-sprite="ragdoll" width="96" height="96" aria-label="奶白身体、灰棕耳朵与眼周、蓝眼睛、粉鼻子的布偶猫正面像素形象" role="img"></canvas><div class="window-floor"></div></div>
            <div class="card-content"><div class="card-title"><h2>布偶猫</h2><span class="pet-status">未到店</span></div><p>蓝眼睛，蓬松柔软的小尾巴。</p></div>
          </article>
        </div>
        <div class="counter">
          <div class="counter-copy"><div><strong>赤柴幼犬 · 首次领养免费</strong><small>给它取个名字，一起回家。</small></div></div>
          <button id="start-adoption" class="pixel-button" type="button">领养这只小柴 <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="adoption-dialog" aria-labelledby="dialog-title">
    <form id="adoption-form" novalidate>
      <button type="button" id="close-dialog" class="close-dialog" aria-label="关闭">×</button>
      <div class="dialog-intro"><span class="dialog-kicker">赤柴幼犬</span><canvas id="dialog-sprite" width="96" height="96" aria-hidden="true"></canvas><h2 id="dialog-title">给它一个名字吧</h2><p>从今天起，就是一起生活的小伙伴了。</p></div>
      <fieldset><legend>这只小柴是</legend><div class="sex-options"><label><input type="radio" name="sex" value="female" required><span>♀ 女生</span></label><label><input type="radio" name="sex" value="male"><span>♂ 男生</span></label></div></fieldset>
      <label class="name-field" for="pet-name">你想叫它什么？</label>
      <input id="pet-name" name="name" type="text" maxlength="12" autocomplete="off" placeholder="输入 1～12 个字的名字" required>
      <p class="field-hint">名字以后也可以修改。</p>
      <p id="adoption-error" class="form-error" role="alert" hidden></p>
      <button id="adopt-button" class="pixel-button adopt-button" type="submit">带它回家 <span aria-hidden="true">→</span></button>
    </form>
  </dialog>

  <script src="../shared/game-catalog.js?v=20260924-catalog-1"></script>
  <script src="data.js?v=black-puppy-adoption-1"></script>
  <script src="growth.js?v=black-puppy-adoption-1"></script>
  <script src="snacks.js?v=snack-variety-1"></script>
  <script src="toys.js?v=care-time-10"></script>
  <script src="model.js?v=account-readoption-1"></script>
  <script src="pet-shop-pets.js?v=3"></script>
  <script src="pet-shop-showcase.js?v=black-puppy-adoption-1"></script>
  <script src="pet-shop.js?v=account-readoption-1"></script>
</body>
</html>
