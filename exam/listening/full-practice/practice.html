    <h1>整套練習</h1>
    <div class="header-exam-actions header-right-slot" data-kiki-header-utility aria-label="答题进度和交卷">
      <span class="pill" id="answeredPill">已答 0 / 31</span>
      <button type="button" class="action-btn primary" id="submitBtn" disabled>提交试卷</button>
    </div>
  </header>

  <main class="page-shell">
    <section class="exam-toolbar" aria-label="整套练习控制区">
      <h2 class="exam-title" id="examTitle">2010年7月</h2>
    </section>

    <section class="result-panel" id="resultPanel"></section>
    <section class="exam-paper" id="examPaper"></section>
  </main>

  <audio id="audioElement" preload="metadata"></audio>
  <div id="wordTooltip" class="custom-tooltip"></div>

  <script src="../shared/listening-progress.js?v=20261019-exam-key1"></script>
  <script src="full-practice-data.js?v=20261019-exam-key1"></script>
  <script src="../../../shared/back-navigation.js?v=20260907-first-paint"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const level = (params.get('level') || 'n2').toLowerCase();
    const examKey = window.ListeningProgress.normalizeExamKey(params.get('year')) || '2010-07';
    const exam = window.ListeningFullPracticeData[level] && window.ListeningFullPracticeData[level].exams[examKey];
    const storageKey = `listening_full_practice_v3::${level}::${examKey}`;
    const audioElement = document.getElementById('audioElement');
    if (!exam) {
      document.body.innerHTML = '<main class="page-shell"><section class="exam-paper"><h2>このセットはまだ準備中です。</h2><p><a href="../../../index.html#exam/exam-listening/exam-listening-full">整套練習へ戻る</a></p></section></main>';
      throw new Error(`Missing full practice exam: ${level} ${examKey}`);
    }

    const flatQuestions = exam.sections.flatMap((section) => section.questions.map((question) => ({ ...question, section })));
    const questionByUid = new Map(flatQuestions.map((question) => [question.uid, question]));
    let state = loadState();

    function freshState() {
      return {
        version: 3,
        answers: {},
        submitted: false,
        submittedAt: '',
        activeAudioUid: ''
      };
    }

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(storageKey) || '{}');
        if (parsed.version !== 3) return freshState();
        return {
          ...freshState(),
          ...parsed,
          answers: parsed.answers && typeof parsed.answers === 'object' ? parsed.answers : {},
          activeAudioUid: ''
        };
      } catch (error) {
        return freshState();
      }
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function hasSubQuestions(question) {
      return Array.isArray(question.subQuestions) && question.subQuestions.length > 0;
    }

    function getQuestionGroups(question) {
      if (hasSubQuestions(question)) {
        return question.subQuestions.map((subQuestion, index) => ({
          key: index,
          title: `質問 ${index + 1}`,
          question: subQuestion.question || '',
          questionTrans: subQuestion.questionTrans || '',
          options: subQuestion.options || []
        }));
      }

      return [{
        key: 0,
        title: '',
        question: '',
        questionTrans: '',
        options: question.options || []
      }];
    }

    function getAnswer(question) {
      const answer = state.answers[question.uid];
      if (hasSubQuestions(question)) {
        return Array.isArray(answer) ? answer : [];
      }
      return Number.isInteger(answer) ? answer : null;
    }

    function isQuestionAnswered(question) {
      const answer = getAnswer(question);
      if (hasSubQuestions(question)) {
        return question.subQuestions.every((_, index) => Number.isInteger(answer[index]));
      }
      return Number.isInteger(answer);
    }

    function getAnsweredCount() {
      return flatQuestions.filter(isQuestionAnswered).length;
    }

    function isComplete() {
      return getAnsweredCount() === flatQuestions.length;
    }

    function getCorrectIndex(options) {
      return (options || []).findIndex((option) => option.correct);
    }

    function isQuestionCorrect(question) {
      if (!isQuestionAnswered(question)) return false;
      const answer = getAnswer(question);
      const groups = getQuestionGroups(question);

      if (hasSubQuestions(question)) {
        return groups.every((group, index) => answer[index] === getCorrectIndex(group.options));
      }

      return answer === getCorrectIndex(groups[0].options);
    }

    function getSummary() {
      const correct = flatQuestions.filter(isQuestionCorrect).length;
      const wrong = flatQuestions.filter((question) => isQuestionAnswered(question) && !isQuestionCorrect(question));
      return {
        total: flatQuestions.length,
        answered: getAnsweredCount(),
        correct,
        wrong
      };
    }

    function getCleanExamLabel() {
      return exam.label.replace(/\s*\(N2\)\s*$/, '');
    }

    function getSectionInstruction(sectionNo, question) {
      const instructions = {
        1: '問題１では、まず質問を聞いてください。それから話を聞いて、問題用紙の１から４の中から、最もよいものを一つ選んでください。',
        2: '問題２では、まず質問を聞いてください。そのあと、問題用紙のせんたくしを読んでください。読む時間があります。それから話を聞いて、問題用紙の１から４の中から、最もよいものを一つ選んでください。',
        3: '問題３では、問題用紙に何も印刷されていません。この問題は、全体としてどんな内容かを聞く問題です。話の前に質問はありません。まず話を聞いてください。それから質問とせんたくしを聞いて、１から４の中から、最もよいものを一つ選んでください。',
        4: '問題４では、問題用紙に何も印刷されていません。まず文を聞いてください。それから、それに対する返事を聞いて、１から３の中から、最もよいものを一つ選んでください。'
      };

      if (sectionNo === 5) {
        return '問題５では、長めの話を聞きます。この問題には練習はありません。メモをとってもかまいません。';
      }

      return instructions[sectionNo] || '';
    }

    function getQuestionLead(question) {
      if (question.sectionNo !== 5) return '';
      if (hasSubQuestions(question)) {
        return 'まず話を聞いてください。それから、二つの質問を聞いて、それぞれ問題用紙の１から４の中から、最もよいものを一つ選んでください。';
      }
      return '問題用紙に何も印刷されていません。まず話を聞いてください。それから、質問とせんたくしを聞いて、１から４の中から、最もよいものを一つ選んでください。';
    }

    function shouldHideOptionsBeforeSubmit(question) {
      if (state.submitted) return false;
      if (question.sectionNo === 3 || question.sectionNo === 4) return true;
      return question.sectionNo === 5 && !hasSubQuestions(question);
    }

    function shouldShowSectionMemo(sectionNo) {
      return !state.submitted && (sectionNo === 3 || sectionNo === 4);
    }

    function shouldShowQuestionMemo(question) {
      return !state.submitted && question.sectionNo === 5 && !hasSubQuestions(question);
    }

    function setAnswer(question, groupIndex, optionIndex) {
      if (state.submitted) return;

      if (hasSubQuestions(question)) {
        const next = getAnswer(question).slice();
        next[groupIndex] = optionIndex;
        state.answers[question.uid] = next;
      } else {
        state.answers[question.uid] = optionIndex;
      }

      saveState();
      render();
    }

    function syncMistakes() {
      if (!window.ListeningProgress) return;
      flatQuestions.forEach((question) => {
        if (!isQuestionAnswered(question) || isQuestionCorrect(question)) return;
        const ids = window.ListeningProgress.getMistakeIds(question.sourceType, question.sourceLevel, question.sourceExamKey) || [];
        if (!ids.includes(question.sourceId)) {
          ids.push(question.sourceId);
          window.ListeningProgress.setMistakeIds(question.sourceType, question.sourceLevel, question.sourceExamKey, ids);
        }
      });
    }

    function submitExam() {
      if (!isComplete() || state.submitted) {
        scrollToFirstUnanswered();
        return;
      }

      state.submitted = true;
      state.submittedAt = new Date().toISOString();
      syncMistakes();
      saveState();
      render();
      document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function restartExam() {
      if (!confirm('この整套練習を最初からやり直しますか。')) return;
      pauseAudio();
      localStorage.removeItem(storageKey);
      state = freshState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function scrollToFirstUnanswered() {
      const first = flatQuestions.find((question) => !isQuestionAnswered(question));
      if (!first) return;
      const target = document.querySelector(`[data-question-uid="${first.uid}"]`);
      if (target) {
        target.classList.add('is-unanswered');
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        window.setTimeout(() => target.classList.remove('is-unanswered'), 1600);
      }
    }

    function getQuestionAudioLabel(question) {
      return `問題${question.sectionNo} ${question.sourceId}番`;
    }

    function playQuestionAudio(uid) {
      const question = questionByUid.get(uid);
      if (!question || !question.audio) return;

      const nextSrc = new URL(question.audio, document.baseURI).href;
      const currentSrc = audioElement.getAttribute('src')
        ? new URL(audioElement.getAttribute('src'), document.baseURI).href
        : '';

      if (state.activeAudioUid === uid && currentSrc === nextSrc && !audioElement.paused) {
        audioElement.pause();
        updateAudioUi();
        return;
      }

      state.activeAudioUid = uid;
      saveState();
      if (currentSrc !== nextSrc) {
        audioElement.src = question.audio;
        audioElement.currentTime = 0;
        audioElement.load();
      }

      const playPromise = audioElement.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.catch((error) => {
          console.warn('音频播放失败:', error);
        }).finally(updateAudioUi);
      } else {
        updateAudioUi();
      }
    }

    function pauseAudio() {
      audioElement.pause();
      audioElement.removeAttribute('src');
      audioElement.load();
      state.activeAudioUid = '';
      saveState();
      updateAudioUi();
    }

    function updateAudioUi() {
      const activeUid = audioElement.getAttribute('src') ? state.activeAudioUid : '';

      document.querySelectorAll('[data-audio-uid]').forEach((button) => {
        const isActive = button.dataset.audioUid === activeUid && !audioElement.paused;
        button.classList.toggle('is-playing', isActive);
        button.textContent = isActive ? 'Ⅱ' : '▶';
        button.setAttribute('aria-label', isActive ? '一時停止' : '再生');
      });
    }

    function renderOptionButton(question, groupIndex, option, optionIndex, selectedIndex, hiddenBeforeSubmit) {
      const correctIndex = getCorrectIndex(getQuestionGroups(question)[groupIndex].options);
      const selected = selectedIndex === optionIndex;
      const classes = ['option-btn'];
      if (hiddenBeforeSubmit) classes.push('choice-circle');
      if (selected) classes.push('selected');

      if (state.submitted) {
        if (optionIndex === correctIndex) classes.push('correct');
        if (selected && optionIndex !== correctIndex) classes.push('wrong');
      }

      const answerDisabled = state.submitted ? 'disabled' : '';
      const optionText = hiddenBeforeSubmit
        ? ''
        : `<span class="option-text">${option.text || ''}${state.submitted && option.translation ? `<span class="option-translation">${option.translation}</span>` : ''}${state.submitted && option.explanation ? `<span class="option-explanation">${option.explanation}</span>` : ''}</span>`;

      return `
        <li>
          <button type="button" class="${classes.join(' ')}" data-answer-uid="${question.uid}" data-group="${groupIndex}" data-index="${optionIndex}" ${answerDisabled}>
            <span class="option-num">${optionIndex + 1}</span>
            ${optionText}
          </button>
        </li>
      `;
    }

    function renderQuestionGroups(question) {
      const groups = getQuestionGroups(question);
      const answer = getAnswer(question);
      const hiddenBeforeSubmit = shouldHideOptionsBeforeSubmit(question);

      return groups.map((group, groupIndex) => {
        const selectedIndex = Array.isArray(answer) ? answer[groupIndex] : answer;
        const showSubTitle = group.question && (state.submitted || question.sectionNo === 5);
        const options = group.options.map((option, optionIndex) => (
          renderOptionButton(question, groupIndex, option, optionIndex, selectedIndex, hiddenBeforeSubmit)
        )).join('');

        return `
          <div class="question-group">
            ${showSubTitle ? `<div class="sub-question-title">${group.title}：${group.question}${state.submitted && group.questionTrans ? `<div class="translation">${group.questionTrans}</div>` : ''}</div>` : ''}
            <ul class="options-list ${hiddenBeforeSubmit ? 'choice-only-list' : ''}">
              ${options}
            </ul>
          </div>
        `;
      }).join('');
    }

    function renderQuestionStatus(question) {
      if (!state.submitted) {
        return isQuestionAnswered(question)
          ? '<span class="question-status">回答済み</span>'
          : '<span class="question-status">未回答</span>';
      }

      return isQuestionCorrect(question)
        ? '<span class="question-status correct">正解</span>'
        : '<span class="question-status wrong">不正解</span>';
    }

    function renderCorrectAnswerLine(question) {
      if (!state.submitted) return '';
      const groups = getQuestionGroups(question);
      const answer = getAnswer(question);
      const correct = isQuestionCorrect(question);
      const correctLabels = groups.map((group, index) => {
        const correctIndex = getCorrectIndex(group.options);
        const selectedIndex = Array.isArray(answer) ? answer[index] : answer;
        const prefix = groups.length > 1 ? `${group.title}: ` : '';
        return `${prefix}正解 ${correctIndex + 1}${selectedIndex !== correctIndex ? ` / あなた ${Number.isInteger(selectedIndex) ? selectedIndex + 1 : '-'}` : ''}`;
      }).join('　');

      return `<div class="answer-line ${correct ? 'correct' : 'wrong'}">${correct ? '正解です' : '不正解です'}　${correctLabels}</div>`;
    }

    function renderAnalysis(question) {
      if (!state.submitted) return '';

      let content = '';
      if (question.dialogueHtml) {
        content = `
          <div class="question-text dialogue-original">${question.dialogueHtml}</div>
          ${question.translation ? `<div class="translation">${question.translation}</div>` : ''}
        `;
      } else if (question.script) {
        const dialogue = Array.isArray(question.script.dialogue)
          ? question.script.dialogue.map((line) => `
            <div class="conversation-line">
              <span class="speaker-name">${line.speaker || ''}</span>
              <div>
                <div>${line.text || ''}</div>
                ${line.trans ? `<div class="translation">${line.trans}</div>` : ''}
              </div>
            </div>
          `).join('')
          : '';

        content = `
          <div class="question-text">${question.script.question || ''}</div>
          ${question.script.questionTrans ? `<div class="translation">${question.script.questionTrans}</div>` : ''}
          <div class="conversation-box">${dialogue}</div>
        `;
      }

      if (!content) return '';

      return `
        <details class="analysis-detail">
          <summary>原文・解析を見る</summary>
          ${content}
        </details>
      `;
    }

    function renderQuestion(question) {
      return `
        <article class="paper-question" id="question-${question.uid}" data-question-uid="${question.uid}">
          <div class="question-head">
            <span class="question-number">${question.sourceId} 番</span>
            <button type="button" class="mini-play" data-audio-uid="${question.uid}" aria-label="再生">▶</button>
            ${renderQuestionStatus(question)}
          </div>
          ${getQuestionLead(question) ? `<p class="question-lead">${getQuestionLead(question)}</p>` : ''}
          ${shouldShowQuestionMemo(question) ? '<div class="question-memo">——　メモ　——</div>' : ''}
          <div class="question-groups">${renderQuestionGroups(question)}</div>
          ${renderCorrectAnswerLine(question)}
          ${renderAnalysis(question)}
        </article>
      `;
    }

    function renderSection(section) {
      const firstQuestion = section.questions[0];
      const sectionQuestions = section.questions.map((question) => ({ ...question, section }));
      return `
        <section class="paper-section" data-section="${section.sectionNo}">
          <h3 class="section-title">問題${section.sectionNo}</h3>
          <p class="section-instruction">${getSectionInstruction(section.sectionNo, firstQuestion)}</p>
          ${shouldShowSectionMemo(section.sectionNo) ? '<div class="section-memo">——　メモ　——</div>' : ''}
          ${sectionQuestions.map(renderQuestion).join('')}
        </section>
      `;
    }

    function renderResultPanel() {
      const panel = document.getElementById('resultPanel');
      if (!state.submitted) {
        panel.classList.remove('show');
        panel.innerHTML = '';
        return;
      }

      const summary = getSummary();
      const wrongLinks = summary.wrong.length
        ? summary.wrong.map((question) => `<button type="button" class="wrong-link" data-scroll-uid="${question.uid}">問題${question.sectionNo} ${question.sourceId}番</button>`).join('')
        : '<span class="pill">错题 0 題</span>';

      panel.classList.add('show');
      panel.innerHTML = `
        <h2>採点結果</h2>
        <div class="result-line">
          <span class="pill">${summary.correct} / ${summary.total} 題</span>
          <span class="pill">错题 ${summary.wrong.length} 題</span>
          <span class="pill">${getCleanExamLabel()}</span>
        </div>
        <div class="wrong-links">${wrongLinks}</div>
      `;
    }

    function renderToolbar() {
      const answered = getAnsweredCount();
      const total = flatQuestions.length;
      const remaining = total - answered;
      document.getElementById('examTitle').textContent = getCleanExamLabel();
      document.getElementById('answeredPill').textContent = `已答 ${answered} / ${total}`;
      document.getElementById('submitBtn').disabled = state.submitted || remaining > 0;
      document.getElementById('submitBtn').textContent = state.submitted ? '已提交' : '提交试卷';
    }

    function render() {
      renderToolbar();
      renderResultPanel();
      document.getElementById('examPaper').innerHTML = `
        <div class="paper-cover">
          <h2>${getCleanExamLabel()} N2 真題</h2>
          <p>第三部分　聴解</p>
        </div>
        ${exam.sections.map(renderSection).join('')}
      `;
      updateAudioUi();
    }

    function showTooltip(event, text) {
      event.stopPropagation();
      const tooltip = document.getElementById('wordTooltip');
      tooltip.textContent = text || '';
      tooltip.style.display = 'block';
      const rect = event.target.getBoundingClientRect();
      const left = Math.min(window.innerWidth - tooltip.offsetWidth - 16, Math.max(16, rect.left));
      const top = Math.min(window.innerHeight - tooltip.offsetHeight - 16, rect.bottom + 8);
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    document.addEventListener('click', (event) => {
      const answerButton = event.target.closest('[data-answer-uid]');
      if (answerButton) {
        const question = questionByUid.get(answerButton.dataset.answerUid);
        if (question) {
          setAnswer(question, Number.parseInt(answerButton.dataset.group, 10), Number.parseInt(answerButton.dataset.index, 10));
        }
        return;
      }

      const audioButton = event.target.closest('[data-audio-uid]');
      if (audioButton) {
        playQuestionAudio(audioButton.dataset.audioUid);
        return;
      }

      const wrongLink = event.target.closest('[data-scroll-uid]');
      if (wrongLink) {
        const target = document.querySelector(`[data-question-uid="${wrongLink.dataset.scrollUid}"]`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      const tipTarget = event.target.closest('[data-tip]');
      if (tipTarget) {
        showTooltip(event, tipTarget.getAttribute('data-tip'));
        return;
      }

      if (!event.target.closest('.custom-tooltip')) {
        document.getElementById('wordTooltip').style.display = 'none';
      }
    });

    document.getElementById('submitBtn').addEventListener('click', submitExam);

    audioElement.addEventListener('timeupdate', updateAudioUi);
    audioElement.addEventListener('loadedmetadata', updateAudioUi);
    audioElement.addEventListener('play', updateAudioUi);
    audioElement.addEventListener('pause', updateAudioUi);
    audioElement.addEventListener('ended', updateAudioUi);

    render();
  </script>
