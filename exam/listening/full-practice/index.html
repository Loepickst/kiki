<script>(function bootstrap() {
    const root = document.documentElement;
    (window.KijiPagePresentation?.dispose || window.KijiPagePresentation?.cancel)?.();
    root.dataset.kijiPaint = 'pending';
    const state = window.KijiPagePresentation = { root, startedAt: performance.now(), failedStyles: new WeakSet() };
    let delay, watchdog;
    state.status = function (failed) {
        if (document.documentElement !== root || root.dataset.kijiPaint === 'ready') return;
        // A page showing its own loading screen keeps it; only failure covers it.
        if (!failed && state.screen && root.dataset.kijiPaint !== 'blocked') return;
        let box = document.getElementById('kiji-page-loading');
        if (!box) {
            box = document.createElement('div');
            box.id = 'kiji-page-loading';
            box.setAttribute('role', 'status');
            // A blocking head script may prevent body from existing at all.
            // Keep the retry layer outside it so even that case stays recoverable.
            root.appendChild(box);
        }
        if (failed) {
            if (root.dataset.kijiPaint === 'blocked' && box.querySelector('button')) return;
            root.dataset.kijiPaint = 'blocked';
            box.textContent = '页面暂时未能完整载入';
            const button = document.createElement('button');
            button.type = 'button'; button.textContent = '重新加载';
            button.onclick = function () { location.reload(); };
            box.appendChild(button);
        } else if (root.dataset.kijiPaint !== 'blocked') box.textContent = '正在打开…';
    };
    // A page may present its own loading screen (the pet cottage's pixel room):
    // it marks the element data-kiji-loading-screen, which stays visible while
    // the page is hidden, and hands it over here as soon as it is parsed. The
    // page keeps the transition up with a hold (which may wait for the reader,
    // e.g. an "enter" button), shows its own slow and retry states, and removes
    // its screen itself, so the watchdog stands down; resource failures and a
    // rejected hold still bring the reload screen.
    state.useScreen = function (screen) {
        state.screen = screen;
        clearTimeout(watchdog);
        if (root.dataset.kijiPaint !== 'blocked') document.getElementById('kiji-page-loading')?.remove();
    };
    function resourceError(event) {
        const target = event.target;
        if (target?.matches?.('link[rel~="stylesheet"]') && !target.disabled && (!target.media || matchMedia(target.media).matches) ||

    document.addEventListener('load', resourceLoaded, true);
    state.cancel = function () { clearTimeout(delay); clearTimeout(watchdog); document.removeEventListener('error', resourceError, true); document.removeEventListener('load', resourceLoaded, true); };

    watchdog = setTimeout(function () { state.status(true); }, 12000);

  <style>
    :root {
      --paper: #ffffff;
      --graphite: #333333;
      --graphite-sub: #666666;
      --graphite-faint: #cccccc;
      --marker-yellow: rgba(255, 213, 79, 0.35);
      --marker-blue: rgba(129, 212, 250, 0.35);
      --marker-pink: rgba(244, 143, 177, 0.35);
      --transition: all 0.2s ease-out;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Serif JP', 'Noto Sans JP', 'Noto Sans SC', serif;
      background: var(--paper);
      color: var(--graphite);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
      z-index: -1;
      pointer-events: none;
    }

    header {
      width: 100%;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border-bottom: 2px solid var(--graphite);
      border-bottom-left-radius: 50% 2px;
      border-bottom-right-radius: 50% 3px;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-align: center;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    header h1 span {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px;
      font-weight: 900;
      padding: 2px 8px;
      border: 1.5px solid var(--graphite);
      border-radius: 2px 8px 2px 6px / 6px 2px 8px 2px;
      background: var(--marker-yellow);
      letter-spacing: 0.08em;
      vertical-align: middle;
    }

    .back-btn, .home-btn {
      text-decoration: none;
      color: var(--graphite);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 4px;
      transition: var(--transition);
      z-index: 2;
    }

    .back-btn:hover, .home-btn:hover { background: var(--marker-yellow); }

    .container {
      width: 95%;
      max-width: 860px;
      padding: 40px 0 80px;
      flex: 1;
    }

    .intro-box {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeIn 0.4s ease-out;
    }

    .intro-box p {
      display: inline-block;
      margin: 0;
      padding: 4px 16px;
      color: var(--graphite);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.1em;
      background: linear-gradient(transparent 50%, rgba(255, 213, 79, 0.4) 50%);
      border-bottom: 1.5px dashed var(--graphite-faint);
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .year-card {
      color: var(--graphite);
      background: transparent;
      border: 1.5px solid var(--graphite);
      border-radius: 3px 255px 4px 25px / 255px 5px 225px 4px;
      padding: 24px;
      transition: var(--transition);
      min-width: 0;
    }

    .year-card:hover {
      transform: translate(-1px, -1px);
    }

    .year-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-bottom: 1.5px dashed var(--graphite-faint);
      padding-bottom: 16px;
      margin-bottom: 18px;
    }

    .year-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .lesson-tag, .meta-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 4px 10px;
      border: 1.5px solid var(--graphite);
      border-radius: 2px 8px 3px 6px / 6px 3px 8px 2px;
      color: var(--graphite);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      background: var(--marker-yellow);
      white-space: nowrap;
    }

    .year-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .exam-btn {
      text-decoration: none;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px;
      font-weight: 800;
      padding: 9px 16px;
      border: 1.5px solid var(--graphite);
      border-radius: 2px 8px 3px 6px / 6px 3px 8px 2px;
      color: var(--graphite);
      background: var(--marker-blue);
      transition: var(--transition);
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .exam-btn:hover {
      filter: brightness(0.96);
      border-style: dashed;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
      header { padding: 12px 14px; }
      header h1 { font-size: 16px; }
      .back-btn, .home-btn { font-size: 12px; padding: 4px 8px; }
      .container { width: calc(100% - 24px); padding: 28px 0 56px; }
      .year-grid { grid-template-columns: 1fr; gap: 18px; }
      .year-card { padding: 20px; }
      .year-title { font-size: 22px; }
      .intro-box p { font-size: 14px; letter-spacing: 0.06em; }
    }
  </style>

  <script>
    const examGrid = document.getElementById('examGrid');
    const exams = window.ListeningFullPracticeData.n2.exams;
    const order = Object.keys(exams).sort((a, b) => a.localeCompare(b));

    examGrid.innerHTML = order.map((examKey) => {
      const exam = exams[examKey];
      const title = exam.label.replace(/\s*\(N2\)\s*$/, '');
      return `
        <article class="year-card">
          <div class="year-info">
            <h2 class="year-title">${title}</h2>
            <div class="year-meta">
              <span class="meta-pill">${exam.totalScreens} 題</span>
              <span class="meta-pill">大題 1-5</span>
            </div>
          </div>
          <a class="exam-btn" href="practice.html?level=n2&year=${exam.examKey}">開始</a>
        </article>
      `;
    }).join('');

    if (typeof window.bindHierarchicalBack === 'function') {
      window.bindHierarchicalBack({
        selector: "[data-back-nav]",
        fallback: "../../../index.html#exam/exam-listening"
      });
    } else if (typeof window.bindStatefulBack === 'function') {
      window.bindStatefulBack({
        selector: "[data-back-nav]",
        fallback: "../../../index.html#exam/exam-listening"
      });
    }
  </script>
