html[data-kiji-paint="pending"] body :not(#kiji-page-loading):not(#kiji-page-loading *):not([data-kiji-loading-screen]):not([data-kiji-loading-screen] *),html[data-kiji-paint="blocked"] body :not(#kiji-page-loading):not(#kiji-page-loading *){visibility:hidden!important}

#kiji-page-loading button{appearance:none;cursor:pointer;border:1px solid #d9d1c8;border-radius:8px;background:#fff;color:#665649;padding:9px 20px;font:inherit}
html.kiji-icons-pending :is(.fa,.fas,.far,.fab,.fa-solid,.fa-regular,.fa-brands)::before{visibility:hidden!important}

<script>(function bootstrap() {
    const root = document.documentElement;
    (window.KijiPagePresentation?.dispose || window.KijiPagePresentation?.cancel)?.();
    root.dataset.kijiPaint = 'pending';
    const state = window.KijiPagePresentation = { root, startedAt: performance.now(), failedStyles: new WeakSet() };
    let delay, watchdog;
    state.status = function (failed) {
        if (document.documentElement !== root || root.dataset.kijiPaint === 'ready') return;
        // A page showing its own loading screen keeps it; only failure covers it.
        if (!failed && state.screen && root.dataset.kijiPaint !== 'blocked') return;
        let box = document.getElementById('kiji-page-loading');
        if (!box) {
            box = document.createElement('div');
            box.id = 'kiji-page-loading';
            box.setAttribute('role', 'status');
            // A blocking head script may prevent body from existing at all.
            // Keep the retry layer outside it so even that case stays recoverable.
            root.appendChild(box);
        }
        if (failed) {
            if (root.dataset.kijiPaint === 'blocked' && box.querySelector('button')) return;
            root.dataset.kijiPaint = 'blocked';
            box.textContent = '页面暂时未能完整载入';
            const button = document.createElement('button');
            button.type = 'button'; button.textContent = '重新加载';
            button.onclick = function () { location.reload(); };
            box.appendChild(button);
        } else if (root.dataset.kijiPaint !== 'blocked') box.textContent = '正在打开…';
    };
    // A page may present its own loading screen (the pet cottage's pixel room):
    // it marks the element data-kiji-loading-screen, which stays visible while
    // the page is hidden, and hands it over here as soon as it is parsed. The
    // page keeps the transition up with a hold (which may wait for the reader,
    // e.g. an "enter" button), shows its own slow and retry states, and removes
    // its screen itself, so the watchdog stands down; resource failures and a
    // rejected hold still bring the reload screen.
    state.useScreen = function (screen) {
        state.screen = screen;
        clearTimeout(watchdog);
        if (root.dataset.kijiPaint !== 'blocked') document.getElementById('kiji-page-loading')?.remove();
    };
    function resourceError(event) {
        const target = event.target;
        if (target?.matches?.('link[rel~="stylesheet"]') && !target.disabled && (!target.media || matchMedia(target.media).matches) ||
            target?.tagName === 'SCRIPT' && /\/page-presentation\.js(?:\?|$)/.test(target.src)) {
            if (target.tagName === 'LINK') state.failedStyles.add(target);
            state.failed = true;
            state.status(true);
        }
    }
    function resourceLoaded(event) { if (event.target?.tagName === 'LINK') state.failedStyles.delete(event.target); }
    document.addEventListener('error', resourceError, true);
    document.addEventListener('load', resourceLoaded, true);
    state.cancel = function () { clearTimeout(delay); clearTimeout(watchdog); document.removeEventListener('error', resourceError, true); document.removeEventListener('load', resourceLoaded, true); };
    delay = setTimeout(function () { state.status(state.failed); }, 600);
    // Lives inline: even a missing controller or a stalled parser has a way out.
    watchdog = setTimeout(function () { state.status(true); }, 12000);
})();</script>

    <script src="./listening-category-system.js?v=20261019-exam-key1"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const type = window.ListeningCategorySystem.normalizeType(params.get('type') || 'immediate_response');
        const level = window.ListeningCategorySystem.normalizeLevel(params.get('level') || 'N2');
        const categoryId = String(params.get('category') || 'all').trim();
        const setNumber = Math.max(0, Number.parseInt(params.get('set'), 10) || 0);
        const progressType = type.replace(/_/g, '-');
        const progressLevel = level.toLowerCase();

        document.body.classList.toggle('is-task-comprehension', type === 'task_comprehension');
        document.body.classList.toggle('is-point-comprehension', type === 'point_comprehension');
        document.body.classList.toggle('is-overview-comprehension', type === 'overview_comprehension');
        document.body.classList.toggle('is-immediate-response', type === 'immediate_response');
        document.body.classList.toggle('is-level-n1', level === 'N1');
        document.body.dataset.listeningPracticeType = type === 'immediate_response'
            ? 'immediate'
            : type.replace(/_/g, '-');

        const state = {
            category: null,
            items: [],
            index: 0,
            selectedIndex: -1,
            judged: false,
            setNumber
        };

        const ui = {
            pageHeading: document.getElementById('pageHeading'),
            levelBadge: document.getElementById('levelBadge'),
            backBtn: document.getElementById('backBtn'),
            categoryTitle: document.getElementById('categoryTitle'),
            questionCounter: document.getElementById('questionCounter'),
            questionTitle: document.getElementById('questionTitle'),
            practiceCard: document.getElementById('practiceCard'),
            questionPrompt: document.getElementById('questionPrompt'),
            scenePanel: document.getElementById('scenePanel'),
            sceneImage: document.getElementById('sceneImage'),
            inlineDialogue: document.getElementById('inlineDialogueBlock'),
            audio: document.getElementById('audioElement'),
            status: document.getElementById('statusBox'),
            options: document.getElementById('optionsList'),
            prev: document.getElementById('questionPrevBtn'),
            next: document.getElementById('questionNextBtn'),
            audioPrev: document.getElementById('prevBtn'),
            audioNext: document.getElementById('nextBtn'),
            reset: document.getElementById('resetBtn'),
            confirm: document.getElementById('confirmBtn'),
            result: document.getElementById('resultPanel'),
            resultTitle: document.getElementById('resultTitle'),
            dialogue: document.getElementById('dialogueBlock'),
            error: document.getElementById('errorCard'),
            errorCopy: document.getElementById('errorCopy'),
            tooltip: document.getElementById('keywordTooltip'),
            introLevel: document.getElementById('introLevel'),
            progressCurrent: document.getElementById('progressCurrent'),
            progressTotal: document.getElementById('progressTotal'),
            progressValue: document.getElementById('progressValue'),
            playerTrackTitle: document.getElementById('playerTrackTitle'),
            mentorText: document.getElementById('mentorText')
        };

        // Set the destination before the unified header runs; keep this same link node.
        ui.backBtn.href = window.ListeningCategorySystem.buildCategoryDirectoryUrl({
            type, level, categoryId, setNumber: state.setNumber
        });

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function getCurrentItem() {
            return state.items[state.index] || null;
        }

        function getCurrentQuestion() {
            const item = getCurrentItem();
            return item ? item.question : null;
        }

        function isTaskComprehension() {
            return type === 'task_comprehension';
        }

        function isImmediateResponse() {
            return type === 'immediate_response';
        }

        function isPointComprehension() {
            return type === 'point_comprehension';
        }

        function isOverviewComprehension() {
            return type === 'overview_comprehension';
        }

        function isScriptListeningType() {
            return isTaskComprehension() || isOverviewComprehension() || isPointComprehension();
        }

        function getDefaultCategoryCopy() {
            if (isPointComprehension()) return '按分类连续练习ポイント理解。';
            if (isOverviewComprehension()) return '按分类连续练习概要理解。';
            return isTaskComprehension() ? '按分类连续练习課題理解。' : '按分类连续练习即时应答。';
        }

        function getHeaderTitle() {
            if (isPointComprehension()) return 'ポイント理解';
            if (isOverviewComprehension()) return '概要理解';
            return isTaskComprehension() ? '課題理解' : '即時応答';
        }

        // Same one-line hints as the annual pages.
        function getMentorTip() {
            if (isPointComprehension()) return '先读问题和选项，再听准要点。';
            if (isOverviewComprehension()) return '选项只在音频里，先抓主旨。';
            return isTaskComprehension() ? '听清最后要先做哪件事。' : '听完一句，选最自然的回应。';
        }

        function getQuestionAudioSrc(question) {
            if (question && question.audio) {
                const audioSrc = String(question.audio);
                const decodedAudioSrc = decodeURIComponent(audioSrc);
                const listeningMarker = '/exam/listening/';
                const markerIndex = decodedAudioSrc.indexOf(listeningMarker);
                if (markerIndex !== -1) {
                    const localSrc = `..${decodedAudioSrc.slice(markerIndex + '/exam/listening'.length)}`;
                    return window.KijiListeningDictationReadings?.versionAudio(localSrc) || localSrc;
                }
                return window.KijiListeningDictationReadings?.versionAudio(audioSrc) || audioSrc;
            }
            if (!question || !isTaskComprehension()) {
                return '';
            }

            const sourceExamKey = window.ListeningCategorySystem.normalizeExamKey(question.sourceExamKey);
            const match = sourceExamKey.match(/^(\d{4})-(\d{2})$/);
            if (!match) {
                return '';
            }

            const localSrc = `../task-comprehension/${level.toLowerCase()}/assets/audio/${match[1]}.${parseInt(match[2], 10)}-${question.questionId}.mp3`;
            return window.KijiListeningDictationReadings?.versionAudio(localSrc) || localSrc;
        }

        function getQuestionImageSrc(question) {
            if (!question || !question.image) return '';
            const imageSrc = String(question.image);
            const decodedImageSrc = decodeURIComponent(imageSrc);
            const listeningMarker = '/exam/listening/';
            const markerIndex = decodedImageSrc.indexOf(listeningMarker);
            if (markerIndex !== -1) {
                return `..${decodedImageSrc.slice(markerIndex + '/exam/listening'.length)}`;
            }
            return imageSrc;
        }

        function setImmediateExplanationMode(question, visible) {
            if (!isImmediateResponse()) return;

            ui.practiceCard.classList.toggle('mode-practice', !visible);
            ui.practiceCard.classList.toggle('mode-explanation', visible);
            ui.questionPrompt.hidden = visible;
            ui.inlineDialogue.hidden = !visible;

            if (!visible) {
                ui.scenePanel.hidden = true;
                ui.sceneImage.removeAttribute('src');
                ui.inlineDialogue.innerHTML = '';
                return;
            }

            const imageSrc = getQuestionImageSrc(question);
            ui.scenePanel.hidden = !imageSrc;
            if (imageSrc) ui.sceneImage.src = imageSrc;
            ui.inlineDialogue.innerHTML = `
                <div class="dialogue-text">${question.dialogueHtml || '（本题暂未整理原文）'}</div>
                ${question.translation ? `<div class="translation">${escapeHtml(question.translation)}</div>` : ''}
            `;
        }

        function renderQuestionTitle(question) {
            ui.questionTitle.hidden = false;
            if (isOverviewComprehension() || isPointComprehension() || (isTaskComprehension() && level === 'N1')) {
                ui.questionTitle.hidden = true;
                ui.questionTitle.textContent = '';
                return;
            }
            if (isScriptListeningType() && question.script && question.script.question) {
                ui.questionTitle.innerHTML = question.script.question;
                return;
            }
            ui.questionTitle.textContent = '请听音频并选择最合适的回答。';
        }

        function normalizeAnalysisHtml(value) {
            return String(value || '').replace(
                /(<span\b[^>]*class=["'][^"']*\bopt-tag\b[^"']*\btag-correct\b[^"']*["'][^>]*>)\s*([①②③④⑤⑥⑦⑧⑨0-9]+)[^<]*(<\/span>)/g,
                '$1$2$3'
            );
        }

        function renderTaskAnalysis(question) {
            const script = question.script || {};
            const promptHtml = script.question
                ? `<div>${normalizeAnalysisHtml(script.question)}</div>`
                : '<div>（本题暂未整理题目原文）</div>';
            const promptTrans = script.questionTrans
                ? `<div class="translation">${escapeHtml(script.questionTrans)}</div>`
                : '';
            const dialogue = Array.isArray(script.dialogue) && script.dialogue.length > 0
                ? script.dialogue.map((line) => `
                    <div class="conversation-line">
                        <span class="speaker-name">${escapeHtml(line.speaker)}</span>
                        <div class="speaker-text">
                            <div>${normalizeAnalysisHtml(line.text)}</div>
                            ${line.trans ? `<div class="translation">${escapeHtml(line.trans)}</div>` : ''}
                        </div>
                    </div>
                `).join('')
                : '<div>（本题暂未整理对话原文）</div>';

            return `
                <div class="question-box">
                    ${promptHtml}
                    ${promptTrans}
                </div>
                <div class="conversation-box">
                    ${dialogue}
                </div>
            `;
        }

        function findInitialIndex() {
            const requestedExamKey = window.ListeningCategorySystem.normalizeExamKey(params.get('examKey'));
            const requestedQuestionId = Number.parseInt(params.get('questionId'), 10);

            if (requestedExamKey && Number.isInteger(requestedQuestionId)) {
                const requestedIndex = state.items.findIndex((item) => {
                    return item.sourceExamKey === requestedExamKey && item.questionId === requestedQuestionId;
                });
                if (requestedIndex >= 0) return requestedIndex;
            }

            const lastQuestion = state.setNumber
                ? window.ListeningCategorySystem.getLastSetQuestion(type, level, categoryId, state.setNumber)
                : window.ListeningCategorySystem.getLastQuestion(type, level, categoryId);
            if (lastQuestion) {
                const lastIndex = state.items.findIndex((item) => {
                    return item.sourceExamKey === lastQuestion.sourceExamKey && item.questionId === lastQuestion.questionId;
                });
                if (lastIndex >= 0) return lastIndex;
            }

            return 0;
        }

        function showError(message) {
            ui.error.classList.remove('hidden');
            document.getElementById('practiceCard').classList.add('hidden');
            ui.errorCopy.textContent = message;
        }

        function syncUrl(item) {
            const nextUrl = window.ListeningCategorySystem.buildCategoryPracticeUrl({
                type,
                level,
                categoryId,
                sourceExamKey: item.sourceExamKey,
                questionId: item.questionId,
                setNumber: state.setNumber
            });
            try {
                window.history.replaceState({ path: nextUrl }, '', nextUrl);
            } catch (error) {
                console.warn('History API is restricted in this environment.');
            }
        }

        function saveProgress(item) {
            window.ListeningCategorySystem.saveLastQuestion(type, level, categoryId, {
                setNumber: state.setNumber,
                sourceExamKey: item.sourceExamKey,
                questionId: item.questionId,
                index: state.index
            });
            if (state.setNumber) {
                window.ListeningCategorySystem.saveLastSetQuestion(type, level, categoryId, state.setNumber, {
                    sourceExamKey: item.sourceExamKey,
                    questionId: item.questionId,
                    index: state.index
                });
            }
        }

        function updateStatus(text, tone) {
            ui.status.textContent = text;
            ui.status.className = 'status-box';
            if (tone) ui.status.classList.add(tone);
        }

        function setAudioSource(src) {
            ui.audio.pause();
            if (src) {
                ui.audio.src = src;
                ui.audio.currentTime = 0;
            } else {
                ui.audio.removeAttribute('src');
            }
            ui.audio.load();
        }

        function renderOptions(question) {
            ui.options.innerHTML = question.options.map((option, index) => {
                const classes = ['option-item'];
                if (state.selectedIndex === index) classes.push('selected');

                if (state.judged) {
                    classes.push('is-locked');
                    if (option.correct) classes.push('judged-correct', 'correct-answer');
                    if (state.selectedIndex === index && !option.correct) classes.push('judged-wrong');
                }

                const shouldShowOptionText = state.judged || isTaskComprehension() || isPointComprehension();
                const shouldShowTranslation = state.judged && option.translation;
                const body = shouldShowOptionText
                    ? `
                        <div class="option-content">
                            <div class="option-text">${option.text || ''}</div>
                            ${shouldShowTranslation ? `<div class="translation">${escapeHtml(option.translation)}</div>` : ''}
                        </div>
                    `
                    : '<span class="option-placeholder" aria-hidden="true"></span>';

                return `
                    <li class="${classes.join(' ')}" data-option-index="${index}">
                        <span class="options-num">${index + 1}</span>
                        ${body}
                    </li>
                `;
            }).join('');

            ui.options.querySelectorAll('.option-item').forEach((node) => {
                node.addEventListener('click', () => {
                    if (state.judged) return;
                    state.selectedIndex = Number.parseInt(node.dataset.optionIndex, 10);
                    ui.confirm.disabled = state.selectedIndex < 0;
                    updateStatus('', 'is-ready');
                    renderOptions(question);
                });
            });
        }

        function renderResult(question, isCorrect) {
            if (isImmediateResponse()) {
                ui.result.hidden = true;
                setImmediateExplanationMode(question, true);
                ui.mentorText.textContent = isCorrect
                    ? '答对了，继续下一题。'
                    : '再听一遍关键处。';
                return;
            }

            ui.result.hidden = false;
            const resultCopy = isScriptListeningType() ? '原文与解析' : '应答与解析';
            ui.resultTitle.textContent = isCorrect ? resultCopy : `已加入错题库 · ${resultCopy}`;
            ui.dialogue.innerHTML = isScriptListeningType()
                ? renderTaskAnalysis(question)
                : `
                    <div class="dialogue-original">${question.dialogueHtml || '（本题暂未整理原文）'}</div>
                    ${question.translation ? `<div class="dialogue-translation">${escapeHtml(question.translation)}</div>` : ''}
                `;
            ui.mentorText.textContent = isCorrect
                ? '答对了，继续下一题。'
                : '再听一遍关键处。';
        }

        function markMistake(question) {
            if (!window.ListeningProgress || typeof window.ListeningProgress.getMistakeIds !== 'function') return;
            const ids = window.ListeningProgress.getMistakeIds(progressType, progressLevel, question.sourceExamKey) || [];
            if (!ids.includes(question.questionId)) {
                ids.push(question.questionId);
                window.ListeningProgress.setMistakeIds(progressType, progressLevel, question.sourceExamKey, ids);
            }
        }

        function confirmAnswer() {
            const question = getCurrentQuestion();
            const item = getCurrentItem();
            if (!question || state.selectedIndex < 0 || state.judged) return;

            const selected = question.options[state.selectedIndex];
            const isCorrect = Boolean(selected && selected.correct);
            state.judged = true;
            ui.confirm.disabled = true;
            ui.reset.disabled = false;

            if (!isCorrect) {
                markMistake(question);
            }

            updateStatus(isCorrect ? '回答正确' : '回答错误', isCorrect ? 'is-correct' : 'is-wrong');
            if (state.setNumber && item) {
                window.ListeningCategorySystem.markCategorySetQuestionAnswered(type, level, categoryId, state.setNumber, item);
            }
            renderOptions(question);
            renderResult(question, isCorrect);
        }

        function resetAnswer() {
            if (!state.judged) {
                state.selectedIndex = -1;
                ui.confirm.disabled = true;
                renderOptions(getCurrentQuestion());
                updateStatus('', 'is-ready');
                return;
            }

            state.selectedIndex = -1;
            state.judged = false;
            ui.result.hidden = true;
            setImmediateExplanationMode(getCurrentQuestion(), false);
            ui.confirm.disabled = true;
            renderOptions(getCurrentQuestion());
            updateStatus('', 'is-ready');
            ui.mentorText.textContent = getMentorTip();
        }

        function renderQuestion() {
            const item = getCurrentItem();
            const question = getCurrentQuestion();
            if (!item || !question) return;

            state.selectedIndex = -1;
            state.judged = false;
            ui.result.hidden = true;
            setImmediateExplanationMode(question, false);
            ui.confirm.disabled = true;
            ui.reset.disabled = false;
            ui.prev.disabled = state.index <= 0;
            ui.next.disabled = state.index >= state.items.length - 1;
            ui.audioPrev.disabled = state.index <= 0;
            ui.audioNext.disabled = state.index >= state.items.length - 1;
            ui.questionCounter.textContent = `${state.index + 1}番`;
            ui.progressCurrent.textContent = String(state.index + 1);
            ui.progressTotal.textContent = String(state.items.length);
            ui.progressValue.style.width = `${((state.index + 1) / state.items.length) * 100}%`;
            ui.playerTrackTitle.textContent = `問題 ${state.index + 1}`;
            ui.mentorText.textContent = getMentorTip();
            renderQuestionTitle(question);
            setAudioSource(getQuestionAudioSrc(question));
            updateStatus('', 'is-ready');
            renderOptions(question);
            saveProgress(item);
            syncUrl(item);
        }

        function moveQuestion(delta) {
            const nextIndex = state.index + delta;
            if (nextIndex < 0 || nextIndex >= state.items.length) return;
            state.index = nextIndex;
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showTooltip(event, text) {
            event.stopPropagation();
            ui.tooltip.textContent = text;
            ui.tooltip.style.display = 'block';
            const rect = event.target.getBoundingClientRect();
            const top = rect.top + window.scrollY - ui.tooltip.offsetHeight - 12;
            let left = rect.left + window.scrollX + rect.width / 2 - ui.tooltip.offsetWidth / 2;
            if (left < 10) left = 10;
            if (left + ui.tooltip.offsetWidth > window.innerWidth - 10) {
                left = window.innerWidth - ui.tooltip.offsetWidth - 10;
            }
            ui.tooltip.style.top = `${Math.max(10, top)}px`;
            ui.tooltip.style.left = `${left}px`;
        }

        window.KijiCategoryDictationContext = {
            getQuestion: getCurrentQuestion,
            getAudioSrc: getQuestionAudioSrc,
            getKey: () => {
                const question = getCurrentQuestion();
                return question ? `${type}::${level}::${question.sourceExamKey}::${question.questionId}` : '';
            },
            getTimeline: (question) => {
                if (!question || type !== 'task_comprehension' || level !== 'N2') return null;
                const examKey = window.ListeningCategorySystem.normalizeExamKey(question.sourceExamKey);
                const match = examKey.match(/^(\d{4})-(\d{2})$/);
                if (!match || !window.KijiN2TaskTimelineMap) return null;
                return window.KijiN2TaskTimelineMap[`${match[1]}.${Number(match[2])}-${question.questionId}`] || null;
            }
        };

        window.showTooltip = showTooltip;
        document.addEventListener('click', (event) => {
            const tipTarget = event.target && event.target.closest
                ? event.target.closest('[data-tip]')
                : null;
            if (tipTarget) {
                showTooltip(event, tipTarget.getAttribute('data-tip'));
                return;
            }
            ui.tooltip.style.display = 'none';
        });

        function init() {
            ui.pageHeading.childNodes[0].nodeValue = `${level} 聴解特訓 `;
            ui.levelBadge.textContent = getHeaderTitle();
            ui.introLevel.textContent = getHeaderTitle();

            state.category = window.ListeningCategorySystem.getCategory(type, level, categoryId);
            state.items = state.setNumber
                ? window.ListeningCategorySystem.getCategorySetItems(type, level, categoryId, state.setNumber)
                : window.ListeningCategorySystem.getCategoryItems(type, level, categoryId);

            if (!state.category) {
                showError('没有找到这个分类，请返回目录重新选择。');
                return;
            }

            if (state.items.length === 0) {
                showError(state.setNumber ? '这个分组里还没有可练习的题目，请返回目录重新选择。' : '这个分类里还没有可练习的题目。');
                return;
            }

            ui.categoryTitle.textContent = state.setNumber ? `${state.category.name} · 第${state.setNumber}组` : state.category.name;
            state.index = findInitialIndex();
            renderQuestion();
        }

        ui.prev.addEventListener('click', () => moveQuestion(-1));
        ui.next.addEventListener('click', () => moveQuestion(1));
        ui.audioPrev.addEventListener('click', () => moveQuestion(-1));
        ui.audioNext.addEventListener('click', () => moveQuestion(1));
        ui.confirm.addEventListener('click', confirmAnswer);
        ui.reset.addEventListener('click', resetAnswer);
        window.addEventListener('DOMContentLoaded', init);
    </script>
