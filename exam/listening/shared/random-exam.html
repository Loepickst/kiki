<script>(function bootstrap() {
    const root = document.documentElement;
    (window.KijiPagePresentation?.dispose || window.KijiPagePresentation?.cancel)?.();
    root.dataset.kijiPaint = 'pending';
    const state = window.KijiPagePresentation = { root, startedAt: performance.now(), failedStyles: new WeakSet() };
    let delay, watchdog;
    state.status = function (failed) {
        if (document.documentElement !== root || root.dataset.kijiPaint === 'ready') return;
        // A page showing its own loading screen keeps it; only failure covers it.
        if (!failed && state.screen && root.dataset.kijiPaint !== 'blocked') return;
        let box = document.getElementById('kiji-page-loading');
        if (!box) {
            box = document.createElement('div');
            box.id = 'kiji-page-loading';
            box.setAttribute('role', 'status');
            // A blocking head script may prevent body from existing at all.
            // Keep the retry layer outside it so even that case stays recoverable.
            root.appendChild(box);
        }
        if (failed) {
            if (root.dataset.kijiPaint === 'blocked' && box.querySelector('button')) return;
            root.dataset.kijiPaint = 'blocked';
            box.textContent = '页面暂时未能完整载入';
            const button = document.createElement('button');
            button.type = 'button'; button.textContent = '重新加载';
            button.onclick = function () { location.reload(); };
            box.appendChild(button);
        } else if (root.dataset.kijiPaint !== 'blocked') box.textContent = '正在打开…';
    };
    // A page may present its own loading screen (the pet cottage's pixel room):
    // it marks the element data-kiji-loading-screen, which stays visible while
    // the page is hidden, and hands it over here as soon as it is parsed. The
    // page keeps the transition up with a hold (which may wait for the reader,
    // e.g. an "enter" button), shows its own slow and retry states, and removes
    // its screen itself, so the watchdog stands down; resource failures and a
    // rejected hold still bring the reload screen.
    state.useScreen = function (screen) {
        state.screen = screen;
        clearTimeout(watchdog);
        if (root.dataset.kijiPaint !== 'blocked') document.getElementById('kiji-page-loading')?.remove();
    };
    function resourceError(event) {
        const target = event.target;
        if (target?.matches?.('link[rel~="stylesheet"]') && !target.disabled && (!target.media || matchMedia(target.media).matches) ||
            target?.tagName === 'SCRIPT' && /\/page-presentation\.js(?:\?|$)/.test(target.src)) {
            if (target.tagName === 'LINK') state.failedStyles.add(target);
            state.failed = true;
            state.status(true);
        }
    }
    function resourceLoaded(event) { if (event.target?.tagName === 'LINK') state.failedStyles.delete(event.target); }
    document.addEventListener('error', resourceError, true);
    document.addEventListener('load', resourceLoaded, true);
    state.cancel = function () { clearTimeout(delay); clearTimeout(watchdog); document.removeEventListener('error', resourceError, true); document.removeEventListener('load', resourceLoaded, true); };
    delay = setTimeout(function () { state.status(state.failed); }, 600);
    // Lives inline: even a missing controller or a stalled parser has a way out.
    watchdog = setTimeout(function () { state.status(true); }, 12000);
})();</script>

    <script>
        window.__LISTENING_RANDOM_EXAM__ = true;

        const params = new URLSearchParams(window.location.search);
        const type = String(params.get('type') || '').trim().toLowerCase();
        const level = String(params.get('level') || '').trim().toUpperCase();
        const fromYear = Number.parseInt(params.get('fromYear'), 10);
        const toYear = Number.parseInt(params.get('toYear'), 10);
        const themeKey = (() => {
            if (type === 'task_comprehension') return 'tc-n1';
            if (type === 'immediate_response' && level === 'N2') return 'ir-n2';
            return 'ir-n1';
        })();
        document.body.dataset.examTheme = themeKey;
        document.body.dataset.listeningPracticeType = type === 'immediate_response'
            ? 'immediate'
            : type.replace(/_/g, '-');
        const randomExamDefaults = (() => {
            if (type === 'task_comprehension') {
                return { questionCount: 6, autoAdvanceSeconds: 5 };
            }
            return { questionCount: 11, autoAdvanceSeconds: 3 };
        })();
        const parsedQuestionCount = Number.parseInt(params.get('count'), 10);
        const QUESTION_COUNT = Number.isFinite(parsedQuestionCount) && parsedQuestionCount > 0
            ? parsedQuestionCount
            : randomExamDefaults.questionCount;
        const parsedAutoAdvanceSeconds = Number.parseInt(params.get('autoAdvanceSeconds'), 10);
        const AUTO_ADVANCE_SECONDS = Number.isFinite(parsedAutoAdvanceSeconds) && parsedAutoAdvanceSeconds > 0
            ? parsedAutoAdvanceSeconds
            : randomExamDefaults.autoAdvanceSeconds;
        const state = {
            questions: [],
            index: 0,
            answers: [],
            selectedIndex: -1,
            submitted: false,
            audioEnded: false,
            countdownTimer: null,
            countdownInterval: null,
            runMeta: null,
            rewardResult: null,
            analysisUnlocked: false,
            summaryVisible: false
        };

        const viewNodes = {
            practice: document.getElementById('practiceView'),
            summary: document.getElementById('summaryView'),
            analysis: document.getElementById('analysisView'),
            immediateAnalysis: document.getElementById('immediateAnalysisView'),
            error: document.getElementById('errorView')
        };

        const ui = {
            backBtn: document.getElementById('backBtn'),
            summaryBackBtn: document.getElementById('summaryBackBtn'),
            errorBackBtn: document.getElementById('errorBackBtn'),
            metaTitle: document.getElementById('metaTitle'),
            counter: document.getElementById('questionCounter'),
            source: document.getElementById('questionSource'),
            title: document.getElementById('questionTitle'),
            copy: document.getElementById('questionCopy'),
            image: document.getElementById('sceneImage'),
            audio: document.getElementById('audioElement'),
            status: document.getElementById('statusBanner'),
            options: document.getElementById('optionsList'),
            confirm: document.getElementById('confirmBtn'),
            drawArea: document.getElementById('drawArea'),
            summaryCopy: document.getElementById('summaryCopy'),
            summaryCorrect: document.getElementById('summaryCorrect'),
            summaryWrong: document.getElementById('summaryWrong'),
            summaryEmpty: document.getElementById('summaryEmpty'),
            summaryAccuracy: document.getElementById('summaryAccuracy'),
            viewAnalysis: document.getElementById('viewAnalysisBtn'),
            retry: document.getElementById('retryBtn'),
            analysisCounter: document.getElementById('analysisCounter'),
            analysisSource: document.getElementById('analysisSource'),
            analysisTitle: document.getElementById('analysisTitle'),
            analysisCopy: document.getElementById('analysisCopy'),
            analysisNote: document.getElementById('analysisResultNote'),
            analysisImage: document.getElementById('analysisImage'),
            analysisAudio: document.getElementById('analysisAudio'),
            analysisTranscript: document.getElementById('analysisTranscript'),
            analysisOptions: document.getElementById('analysisOptions'),
            analysisPrev: document.getElementById('analysisPrevBtn'),
            analysisNext: document.getElementById('analysisNextBtn'),
            analysisBack: document.getElementById('analysisBackBtn'),
            immediateAnalysisCounter: document.getElementById('immediateAnalysisCounter'),
            immediateAnalysisSource: document.getElementById('immediateAnalysisSource'),
            immediateAnalysisMentor: document.getElementById('immediateAnalysisMentor'),
            immediateAnalysisScene: document.getElementById('immediateAnalysisScene'),
            immediateAnalysisImage: document.getElementById('immediateAnalysisImage'),
            immediateAnalysisDialogue: document.getElementById('immediateAnalysisDialogue'),
            immediateAnalysisOptions: document.getElementById('immediateAnalysisOptions'),
            immediateAnalysisStatus: document.getElementById('immediateAnalysisStatus'),
            immediateAnalysisPrev: document.getElementById('immediateAnalysisPrevBtn'),
            immediateAnalysisNext: document.getElementById('immediateAnalysisNextBtn'),
            immediateAnalysisBack: document.getElementById('immediateAnalysisBackBtn'),
            errorCopy: document.getElementById('errorCopy'),
            tooltip: document.getElementById('keywordTooltip'),
            randomLevel: document.getElementById('randomLevel'),
            progressCurrent: document.getElementById('progressCurrent'),
            progressTotal: document.getElementById('progressTotal'),
            progressValue: document.getElementById('progressValue'),
            randomTrackTitle: document.getElementById('randomTrackTitle'),
            mentorText: document.getElementById('randomMentorText'),
            audioDock: document.getElementById('practiceAudioDock')
        };

        function htmlEscape(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function normalizeTypeLabel(value) {
            return value === 'task_comprehension' ? '课题理解' : '即时应答';
        }

        function buildIndexHref() {
            const folder = type === 'task_comprehension' ? 'task-comprehension' : 'immediate-response';
            return `../${folder}/${level.toLowerCase()}/index.html`;
        }

        function setHidden(node, hidden) {
            node.classList.toggle('hidden', hidden);
        }

        function showView(name) {
            setHidden(viewNodes.practice, name !== 'practice');
            setHidden(viewNodes.summary, name !== 'summary');
            setHidden(viewNodes.analysis, name !== 'analysis');
            setHidden(viewNodes.immediateAnalysis, name !== 'immediate-analysis');
            setHidden(viewNodes.error, name !== 'error');
            if (ui.audioDock) setHidden(ui.audioDock, name !== 'practice');
        }

        function stripHighlightHtml(html) {
            if (!html) return '';
            const wrapper = document.createElement('div');
            wrapper.innerHTML = html;
            wrapper.querySelectorAll('.opt-tag').forEach((node) => node.remove());
            ['highlight-correct', 'highlight-wrong', 'explain-wrong'].forEach((className) => {
                wrapper.querySelectorAll(`.${className}`).forEach((node) => {
                    const parent = node.parentNode;
                    if (!parent) return;
                    while (node.firstChild) {
                        parent.insertBefore(node.firstChild, node);
                    }
                    parent.removeChild(node);
                });
            });
            wrapper.querySelectorAll('[class]').forEach((node) => {
                node.classList.remove('highlight-correct', 'highlight-wrong', 'explain-wrong');
                if (!node.className.trim()) {
                    node.removeAttribute('class');
                }
            });
            return wrapper.innerHTML;
        }

        function sanitizeExamHtml(html) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = stripHighlightHtml(html);
            wrapper.querySelectorAll('[onclick]').forEach((node) => node.removeAttribute('onclick'));
            wrapper.querySelectorAll('.keyword').forEach((node) => {
                node.classList.remove('keyword');
                if (!node.className.trim()) {
                    node.removeAttribute('class');
                }
            });
            return wrapper.innerHTML;
        }

        function getQuestionPrompt(question) {
            if (type === 'task_comprehension' && question.script) {
                const rawPrompt = question.script.question || '音频播放后作答。';
                return {
                    title: sanitizeExamHtml(rawPrompt),
                    copy: ''
                };
            }
            return {
                title: '请听音频并选择最合适的回答。',
                copy: ''
            };
        }

        function getCurrentQuestion() {
            return state.questions[state.index] || null;
        }

        function isImmediateResponseExam() {
            return type === 'immediate_response';
        }

        function getAnswerRecord(index) {
            return state.answers[index] || {
                selectedIndex: -1,
                submitted: false,
                isCorrect: false,
                unanswered: false
            };
        }

        function createSourceLabel(question) {
            return `${question.sourceLabel} · 第 ${question.questionId} 题`;
        }

        function clearCountdown() {
            if (state.countdownTimer) {
                window.clearTimeout(state.countdownTimer);
                state.countdownTimer = null;
            }
            if (state.countdownInterval) {
                window.clearInterval(state.countdownInterval);
                state.countdownInterval = null;
            }
        }

        function updateStatus(text, tone) {
            ui.status.textContent = text;
            ui.status.className = 'status-banner';
            if (tone) {
                ui.status.classList.add(tone);
            }
        }

        function dispatchPhase(phase, stats) {
            if (!window.StudyQuestTestUi || typeof window.StudyQuestTestUi.dispatchPracticeState !== 'function') {
                return;
            }
            window.StudyQuestTestUi.dispatchPracticeState({
                module: 'listening',
                subType: type,
                mode: 'challenge',
                phase,
                questionIndex: stats.total,
                questionCount: stats.total,
                accuracy: stats.total > 0 ? stats.correct / stats.total : 0,
                streak: stats.correct
            });
        }

        function computeStats() {
            const total = state.questions.length;
            let correct = 0;
            let answered = 0;
            let empty = 0;
            state.answers.forEach((answer) => {
                if (!answer || !answer.submitted) {
                    empty += 1;
                    return;
                }
                answered += 1;
                if (answer.isCorrect) {
                    correct += 1;
                }
            });
            const wrong = Math.max(0, answered - correct);
            const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;
            return { total, correct, wrong, empty, accuracy };
        }

        function showTooltip(event, text) {
            event.stopPropagation();
            ui.tooltip.textContent = text;
            ui.tooltip.style.display = 'block';
            const rect = event.target.getBoundingClientRect();
            const top = rect.top + window.scrollY - ui.tooltip.offsetHeight - 12;
            let left = rect.left + window.scrollX + rect.width / 2 - ui.tooltip.offsetWidth / 2;
            if (left < 10) left = 10;
            if (left + ui.tooltip.offsetWidth > window.innerWidth - 10) {
                left = window.innerWidth - ui.tooltip.offsetWidth - 10;
            }
            ui.tooltip.style.top = `${Math.max(10, top)}px`;
            ui.tooltip.style.left = `${left}px`;
        }

        window.showTooltip = showTooltip;
        document.addEventListener('click', () => {
            ui.tooltip.style.display = 'none';
        });

        function renderOptions(options, mode) {
            return options.map((option, index) => {
                const answer = getAnswerRecord(state.index);
                const classes = ['option-item'];
                const choiceOnly = mode === 'practice' && isImmediateResponseExam();
                if (mode === 'practice') {
                    if (answer.selectedIndex === index) classes.push('selected');
                    if (answer.submitted && !choiceOnly) classes.push('is-locked');
                    if (choiceOnly) classes.push('is-choice-only');
                } else {
                    const userPicked = answer.selectedIndex === index;
                    if (option.correct) classes.push('judged-correct', 'correct-answer');
                    if (userPicked && !option.correct) classes.push('judged-wrong');
                }
                const optionBody = choiceOnly
                    ? ''
                    : `
                        <div class="option-content">
                            <div class="option-text">${mode === 'practice' ? sanitizeExamHtml(option.text) : option.text}</div>
                            ${mode === 'analysis' && option.translation ? `<div class="translation">${htmlEscape(option.translation)}</div>` : ''}
                        </div>
                    `;
                return `
                    <li class="${classes.join(' ')}" data-option-index="${index}">
                        <span class="options-num">${index + 1}</span>
                        ${optionBody}
                    </li>
                `;
            }).join('');
        }

        function bindOptionEvents() {
            const answer = getAnswerRecord(state.index);
            ui.options.querySelectorAll('.option-item').forEach((item) => {
                item.addEventListener('click', () => {
                    if (answer.submitted) return;
                    state.selectedIndex = Number(item.dataset.optionIndex);
                    answer.selectedIndex = state.selectedIndex;
                    if (!isImmediateResponseExam()) {
                        ui.confirm.disabled = false;
                    }
                    ui.options.querySelectorAll('.option-item').forEach((node) => node.classList.remove('selected'));
                    item.classList.add('selected');
                    ui.mentorText.textContent = '听到最后一个音再确认。';
                    if (isImmediateResponseExam()) {
                        updateStatus(
                            state.audioEnded ? '切题前可改选' : '音频结束前可改选',
                            'is-ready'
                        );
                    } else {
                        updateStatus('确认后本题锁定', 'is-ready');
                    }
                });
            });
        }

        function tryAutoplayCurrentAudio() {
            if (!isImmediateResponseExam() || state.index <= 0 || !ui.audio.src) {
                return;
            }
            window.setTimeout(() => {
                const playPromise = ui.audio.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {});
                }
            }, 120);
        }

        function renderPracticeQuestion() {
            const question = getCurrentQuestion();
            if (!question) {
                showSummary();
                return;
            }

            clearCountdown();
            state.submitted = false;
            state.audioEnded = false;
            state.selectedIndex = -1;

            const answer = getAnswerRecord(state.index);
            if (answer.submitted) {
                state.submitted = true;
                state.selectedIndex = answer.selectedIndex;
            }

            const prompt = getQuestionPrompt(question);
            ui.counter.textContent = `${state.index + 1}番`;
            ui.source.textContent = createSourceLabel(question);
            ui.progressCurrent.textContent = String(state.index + 1);
            ui.progressTotal.textContent = String(state.questions.length);
            ui.progressValue.style.width = `${((state.index + 1) / state.questions.length) * 100}%`;
            ui.randomTrackTitle.textContent = `問題 ${state.index + 1}`;
            ui.mentorText.textContent = type === 'task_comprehension' ? '听清最后要先做哪件事。' : '听完一句，选最自然的回应。';
            ui.title.innerHTML = prompt.title;
            ui.copy.textContent = prompt.copy;
            ui.audio.src = question.audio || '';
            ui.audio.currentTime = 0;
            ui.image.src = '';
            ui.image.classList.add('hidden');
            ui.options.classList.toggle('is-choice-grid', isImmediateResponseExam());
            ui.options.innerHTML = renderOptions(question.options, 'practice');
            bindOptionEvents();
            ui.confirm.classList.toggle('hidden', isImmediateResponseExam());
            ui.confirm.disabled = state.selectedIndex < 0 || answer.submitted;
            updateStatus('', 'is-ready');
            tryAutoplayCurrentAudio();
        }

        function recordCurrentAnswer(forceEmpty = false) {
            const question = getCurrentQuestion();
            if (!question) return;
            const answer = getAnswerRecord(state.index);
            if (answer.submitted) {
                return;
            }

            let selectedIndex = Number(state.selectedIndex);
            if (forceEmpty || !Number.isInteger(selectedIndex) || selectedIndex < 0) {
                answer.selectedIndex = -1;
                answer.submitted = true;
                answer.unanswered = true;
                answer.isCorrect = false;
            } else {
                answer.selectedIndex = selectedIndex;
                answer.submitted = true;
                answer.unanswered = false;
                answer.isCorrect = Boolean(question.options[selectedIndex] && question.options[selectedIndex].correct);
            }
            state.answers[state.index] = answer;
            state.submitted = true;

            if (!answer.isCorrect) {
                if (window.ListeningProgress && typeof window.ListeningProgress.setMistakeIds === 'function') {
                    const ids = window.ListeningProgress.getMistakeIds(type.replace(/_/g, '-'), level.toLowerCase(), question.sourceExamKey) || [];
                    if (!ids.includes(question.questionId)) {
                        ids.push(question.questionId);
                        window.ListeningProgress.setMistakeIds(type.replace(/_/g, '-'), level.toLowerCase(), question.sourceExamKey, ids);
                    }
                }
            }
        }

        function startCountdown() {
            if (state.countdownTimer) return;
            let remaining = AUTO_ADVANCE_SECONDS;
            updateStatus(
                isImmediateResponseExam()
                    ? `${remaining} 秒后自动进入下一题，可继续改选。`
                    : `${remaining} 秒后自动进入下一题。`,
                'is-recorded'
            );
            state.countdownInterval = window.setInterval(() => {
                remaining -= 1;
                if (remaining > 0) {
                    updateStatus(
                        isImmediateResponseExam()
                            ? `${remaining} 秒后自动进入下一题，可继续改选。`
                            : `${remaining} 秒后自动进入下一题。`,
                        'is-recorded'
                    );
                }
            }, 1000);
            state.countdownTimer = window.setTimeout(() => {
                clearCountdown();
                advanceQuestion();
            }, AUTO_ADVANCE_SECONDS * 1000);
        }

        function advanceQuestion() {
            recordCurrentAnswer(state.selectedIndex < 0);
            if (state.index >= state.questions.length - 1) {
                showSummary();
                return;
            }
            state.index += 1;
            renderPracticeQuestion();
        }

        function onAudioEnded() {
            state.audioEnded = true;
            startCountdown();
        }

        function onConfirmAnswer() {
            if (isImmediateResponseExam()) {
                return;
            }
            if (state.selectedIndex < 0) {
                return;
            }
            recordCurrentAnswer(false);
            ui.confirm.disabled = true;
            ui.options.innerHTML = renderOptions(getCurrentQuestion().options, 'practice');
            bindOptionEvents();
            if (state.audioEnded) {
                updateStatus('已记录，等待切题。', 'is-recorded');
                startCountdown();
            } else {
                updateStatus('已记录，音频结束后自动切题。', 'is-recorded');
            }
        }

        function buildDrawMarkup(runKey) {
            if (!window.StudyQuestTestUi || typeof window.StudyQuestTestUi.getDrawAffordanceMarkup !== 'function') {
                return '';
            }
            return window.StudyQuestTestUi.getDrawAffordanceMarkup(runKey);
        }

        function showSummary() {
            clearCountdown();
            const stats = computeStats();
            ui.audio.pause();
            showView('summary');
            ui.summaryCorrect.textContent = String(stats.correct);
            ui.summaryWrong.textContent = String(stats.wrong);
            ui.summaryEmpty.textContent = String(stats.empty);
            ui.summaryAccuracy.textContent = `${stats.accuracy}%`;
            ui.summaryCopy.textContent = '';

            if (!state.rewardResult && state.runMeta && window.StudyQuestTestServer && typeof window.StudyQuestTestServer.completeRun === 'function') {
                state.rewardResult = window.StudyQuestTestServer.completeRun({
                    runKey: state.runMeta.runKey,
                    module: 'listening',
                    subType: type,
                    rewardTrack: 'listening_random_exam',
                    mode: 'challenge',
                    scopeKey: `random-${fromYear}-${toYear}-${QUESTION_COUNT}`,
                    level,
                    questionCount: stats.total,
                    answeredCount: stats.total - stats.empty,
                    correctCount: stats.correct,
                    accuracy: stats.total > 0 ? stats.correct / stats.total : 0,
                    cleared: true,
                    sourcePage: window.location.pathname
                });
            }

            ui.drawArea.innerHTML = state.rewardResult && state.rewardResult.accepted
                ? buildDrawMarkup(state.rewardResult.drawOffer && state.rewardResult.drawOffer.runKey || (state.runMeta && state.runMeta.runKey))
                : '';

            dispatchPhase(stats.accuracy === 100 ? 'perfect_clear' : 'clear', {
                total: stats.total,
                correct: stats.correct
            });
        }

        function renderImmediateAnalysis(question) {
            return `
                <div class="analysis-block">
                    <h3>对话原文</h3>
                    <div class="analysis-line analysis-dialogue">${question.dialogueHtml || '（本题暂未整理原文）'}</div>
                    ${question.translation ? `<div class="analysis-translation">${htmlEscape(question.translation)}</div>` : ''}
                </div>
            `;
        }

        function renderTaskAnalysis(question) {
            const script = question.script || {};
            const promptHtml = script.question ? `<div class="analysis-line">${script.question}</div>` : '';
            const promptTrans = script.questionTrans ? `<div class="analysis-translation">${htmlEscape(script.questionTrans)}</div>` : '';
            const dialogue = Array.isArray(script.dialogue) ? script.dialogue.map((line) => `
                <div class="analysis-line">
                    <span class="analysis-speaker">${htmlEscape(line.speaker)}：</span>${line.text}
                    ${line.trans ? `<div class="analysis-translation">${htmlEscape(line.trans)}</div>` : ''}
                </div>
            `).join('') : '（本题暂未整理对话原文）';
            return `
                <div class="analysis-block">
                    <h3>题目原文</h3>
                    ${promptHtml}
                    ${promptTrans}
                    <div class="analysis-dialogue">${dialogue}</div>
                </div>
            `;
        }

        function normalizeListeningAssetSrc(value) {
            if (!value) return '';
            const source = String(value);
            const decodedSource = decodeURIComponent(source);
            const listeningMarker = '/exam/listening/';
            const markerIndex = decodedSource.indexOf(listeningMarker);
            if (markerIndex !== -1) {
                return `..${decodedSource.slice(markerIndex + '/exam/listening'.length)}`;
            }
            return source;
        }

        function renderImmediateUnifiedAnalysis(question, answer) {
            ui.immediateAnalysisCounter.textContent = `${state.index + 1}番`;
            ui.immediateAnalysisSource.textContent = createSourceLabel(question);

            const imageSrc = normalizeListeningAssetSrc(question.image);
            ui.immediateAnalysisScene.hidden = !imageSrc;
            if (imageSrc) {
                ui.immediateAnalysisImage.src = imageSrc;
            } else {
                ui.immediateAnalysisImage.removeAttribute('src');
            }

            ui.immediateAnalysisDialogue.innerHTML = `
                <div class="dialogue-text">${question.dialogueHtml || '（本题暂未整理原文）'}</div>
                ${question.translation ? `<div class="translation">${htmlEscape(question.translation)}</div>` : ''}
            `;
            ui.immediateAnalysisOptions.innerHTML = renderOptions(question.options, 'analysis');

            let statusText = '本题未作答';
            let statusTone = 'is-ready';
            let mentorText = '对照原文看看答案。';
            if (answer.submitted && answer.isCorrect) {
                statusText = '回答正确';
                statusTone = 'is-correct';
                mentorText = '答对了，继续下一题。';
            } else if (answer.submitted && !answer.unanswered) {
                statusText = '回答错误';
                statusTone = 'is-wrong';
                mentorText = '再听一遍关键处。';
            }
            ui.immediateAnalysisStatus.textContent = statusText;
            ui.immediateAnalysisStatus.className = `status-box ${statusTone}`;
            ui.immediateAnalysisMentor.textContent = mentorText;
            ui.immediateAnalysisPrev.disabled = state.index === 0;
            ui.immediateAnalysisNext.disabled = state.index >= state.questions.length - 1;
        }

        function renderAnalysis() {
            const question = getCurrentQuestion();
            const answer = getAnswerRecord(state.index);
            if (!question) return;

            if (isImmediateResponseExam()) {
                renderImmediateUnifiedAnalysis(question, answer);
                return;
            }

            ui.analysisCounter.textContent = `解析 ${state.index + 1} / ${state.questions.length}`;
            ui.analysisSource.textContent = createSourceLabel(question);
            ui.analysisTitle.textContent = type === 'task_comprehension' ? '课题理解解析' : '即时应答解析';
            ui.analysisCopy.textContent = '';

            ui.analysisAudio.src = question.audio || '';
            ui.analysisImage.src = '';
            ui.analysisImage.classList.add('hidden');

            if (!answer.submitted || answer.unanswered) {
                ui.analysisNote.textContent = '本题未作答';
                ui.analysisNote.className = 'analysis-note is-empty';
            } else if (answer.isCorrect) {
                ui.analysisNote.textContent = '本题答对了';
                ui.analysisNote.className = 'analysis-note is-correct';
            } else {
                ui.analysisNote.textContent = '本题答错了';
                ui.analysisNote.className = 'analysis-note is-wrong';
            }

            ui.analysisTranscript.innerHTML = type === 'task_comprehension'
                ? renderTaskAnalysis(question)
                : renderImmediateAnalysis(question);
            ui.analysisOptions.innerHTML = `
                <div class="analysis-block">
                    <h3>选项解析</h3>
                    <ol class="options-list">${renderOptions(question.options, 'analysis')}</ol>
                </div>
            `;

            ui.analysisPrev.disabled = state.index === 0;
            ui.analysisNext.disabled = state.index >= state.questions.length - 1;
        }

        function showAnalysis() {
            state.analysisUnlocked = true;
            state.index = 0;
            showView(isImmediateResponseExam() ? 'immediate-analysis' : 'analysis');
            renderAnalysis();
        }

        function showError(message) {
            showView('error');
            ui.errorCopy.textContent = message;
        }

        function initializeMeta() {
            const indexHref = buildIndexHref();
            ui.backBtn.href = indexHref;
            ui.summaryBackBtn.href = indexHref;
            ui.errorBackBtn.href = indexHref;
            ui.metaTitle.textContent = fromYear && toYear ? `${fromYear === toYear ? fromYear : `${fromYear}–${toYear}`} 年` : '随机练习';
            ui.randomLevel.textContent = type === 'task_comprehension' ? '課題理解' : '即時応答';
        }

        function initializeQuestions() {
            if (!window.ListeningQuestionPools) {
                showError('听力共享题池未加载成功，请返回题型页后重试。');
                return false;
            }

            const count = window.ListeningQuestionPools.countQuestionsInRange(type, level, fromYear, toYear);
            if (!count || count < QUESTION_COUNT) {
                showError(`当前年份范围题量不足 ${QUESTION_COUNT} 题，请返回题型页扩大年份范围后再开始随机考试。`);
                return false;
            }

            state.questions = window.ListeningQuestionPools.sampleQuestions(type, level, fromYear, toYear, QUESTION_COUNT).map((question, index) => ({
                ...question,
                uid: `${question.sourceExamKey}-${question.questionId}-${index}`
            }));
            state.answers = state.questions.map(() => ({
                selectedIndex: -1,
                submitted: false,
                isCorrect: false,
                unanswered: false
            }));
            return true;
        }

        function initializeRewardRun() {
            if (!window.StudyQuestTestServer || typeof window.StudyQuestTestServer.startRun !== 'function') {
                return;
            }
            state.runMeta = window.StudyQuestTestServer.startRun({
                module: 'listening',
                subType: type,
                rewardTrack: 'listening_random_exam',
                mode: 'challenge',
                scopeKey: `random-${fromYear}-${toYear}-${QUESTION_COUNT}`,
                level
            });
        }

        ui.confirm.addEventListener('click', onConfirmAnswer);
        ui.audio.addEventListener('ended', onAudioEnded);
        ui.viewAnalysis.addEventListener('click', showAnalysis);
        ui.retry.addEventListener('click', () => window.location.reload());
        ui.analysisPrev.addEventListener('click', () => {
            if (state.index <= 0) return;
            state.index -= 1;
            renderAnalysis();
        });
        ui.analysisNext.addEventListener('click', () => {
            if (state.index >= state.questions.length - 1) return;
            state.index += 1;
            renderAnalysis();
        });
        ui.analysisBack.addEventListener('click', () => showView('summary'));
        ui.immediateAnalysisPrev.addEventListener('click', () => {
            if (state.index <= 0) return;
            state.index -= 1;
            renderAnalysis();
        });
        ui.immediateAnalysisNext.addEventListener('click', () => {
            if (state.index >= state.questions.length - 1) return;
            state.index += 1;
            renderAnalysis();
        });
        ui.immediateAnalysisBack.addEventListener('click', () => showView('summary'));

        initializeMeta();
        if (initializeQuestions()) {
            initializeRewardRun();
            showView('practice');
            renderPracticeQuestion();
        }
    </script>
