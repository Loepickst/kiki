<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1160" role="img" aria-labelledby="title desc">
  <title id="title">飞机座位选择图</title>
  <desc id="desc">白色座位为空位，蓝灰色座位为已占用座位，四个候选座位分别标为1、2、3、4。</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <g id="seat">
      <rect x="5" y="0" width="58" height="56" rx="8" class="seat-body"/>
      <rect x="9" y="38" width="50" height="24" rx="5" class="seat-cushion"/>
      <rect x="0" y="12" width="8" height="35" rx="3" class="seat-arm"/>
      <rect x="60" y="12" width="8" height="35" rx="3" class="seat-arm"/>
    </g>
    <style>
      .seat-body,.seat-cushion,.seat-arm{stroke:#303437;stroke-width:2.2}
      .occupied{fill:#b9cfdd}.available{fill:#fbfaf6}
      .leader{fill:none;stroke:#111;stroke-width:3}
      .target{fill:#111}
      .label{font:700 66px Arial,sans-serif;fill:#070707}
      .ui{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#111}
    </style>
  </defs>

  <rect width="1300" height="1160" fill="#f7f5ef" filter="url(#paper)"/>
  <rect x="124" y="34" width="1052" height="1075" fill="#fdfcf8" stroke="#3a3e40" stroke-width="3"/>
  <rect x="124" y="34" width="1052" height="42" fill="#33393c"/>
  <rect x="124" y="76" width="1052" height="35" fill="#edf1f1" stroke="#3a3e40" stroke-width="2"/>
  <rect x="235" y="82" width="760" height="24" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <rect x="1080" y="45" width="24" height="22" rx="2" fill="#f1f1ef" stroke="#111" stroke-width="2"/>
  <rect x="1112" y="45" width="24" height="22" rx="2" fill="#f1f1ef" stroke="#111" stroke-width="2"/>
  <rect x="1144" y="45" width="24" height="22" rx="2" fill="#f1f1ef" stroke="#111" stroke-width="2"/>
  <path d="M1086 57h12M1118 51v11h12V51M1150 51l12 12m0-12-12 12" stroke="#111" stroke-width="2" fill="none"/>

  <path d="M176 154 C180 470 192 675 272 790 C305 838 345 850 414 850 H886 C955 850 995 838 1028 790 C1108 675 1120 470 1124 154" fill="none" stroke="#242729" stroke-width="8" stroke-linecap="round"/>
  <path d="M548 244 L650 185 L752 244 L709 244 L709 275 M591 275 L591 244 Z" fill="none" stroke="#2b2f31" stroke-width="4" stroke-linejoin="round"/>

  <g class="occupied" transform="translate(230 330)"><use href="#seat"/></g>
  <g class="available" transform="translate(304 330)"><use href="#seat"/></g>
  <g class="available" transform="translate(378 330)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(500 330)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(574 330)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(648 330)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(722 330)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(844 330)"><use href="#seat"/></g>
  <g class="available" transform="translate(918 330)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(992 330)"><use href="#seat"/></g>

  <g class="occupied" transform="translate(230 490)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(304 490)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(378 490)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(500 490)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(574 490)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(648 490)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(722 490)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(844 490)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(918 490)"><use href="#seat"/></g>
  <g class="available" transform="translate(992 490)"><use href="#seat"/></g>

  <g class="available" transform="translate(304 650)"><use href="#seat"/></g>
  <g class="available" transform="translate(378 650)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(500 650)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(574 650)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(648 650)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(722 650)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(844 650)"><use href="#seat"/></g>
  <g class="occupied" transform="translate(918 650)"><use href="#seat"/></g>

  <path class="leader" d="M70 585 L412 358"/>
  <rect class="target" x="405" y="351" width="14" height="14"/>
  <text class="label" x="36" y="610">1</text>

  <path class="leader" d="M1230 505 L952 358"/>
  <rect class="target" x="945" y="351" width="14" height="14"/>
  <text class="label" x="1232" y="530">2</text>

  <path class="leader" d="M70 895 L338 678"/>
  <rect class="target" x="331" y="671" width="14" height="14"/>
  <text class="label" x="36" y="920">3</text>

  <path class="leader" d="M1230 745 L1026 518"/>
  <rect class="target" x="1019" y="511" width="14" height="14"/>
  <text class="label" x="1232" y="770">4</text>

  <text class="ui" x="650" y="918" text-anchor="middle" font-size="24">こう　　ほう</text>
  <text class="ui" x="650" y="965" text-anchor="middle" font-size="50" font-weight="700">後　方</text>
  <rect x="742" y="1005" width="175" height="72" fill="#eef3f3" stroke="#34393a" stroke-width="3"/>
  <rect x="950" y="1005" width="175" height="72" fill="#eef3f3" stroke="#34393a" stroke-width="3"/>
  <text class="ui" x="830" y="1053" text-anchor="middle" font-size="34" font-weight="700">戻 る</text>
  <text class="ui" x="1038" y="1053" text-anchor="middle" font-size="34" font-weight="700">決 定</text>
</svg>
