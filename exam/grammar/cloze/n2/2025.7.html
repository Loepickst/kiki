<script>(function bootstrap() {
    const root = document.documentElement;
    (window.KijiPagePresentation?.dispose || window.KijiPagePresentation?.cancel)?.();
    root.dataset.kijiPaint = 'pending';
    const state = window.KijiPagePresentation = { root, startedAt: performance.now(), failedStyles: new WeakSet() };
    let delay, watchdog;
    state.status = function (failed) {
        if (document.documentElement !== root || root.dataset.kijiPaint === 'ready') return;
        // A page showing its own loading screen keeps it; only failure covers it.
        if (!failed && state.screen && root.dataset.kijiPaint !== 'blocked') return;
        let box = document.getElementById('kiji-page-loading');
        if (!box) {
            box = document.createElement('div');
            box.id = 'kiji-page-loading';
            box.setAttribute('role', 'status');
            // A blocking head script may prevent body from existing at all.
            // Keep the retry layer outside it so even that case stays recoverable.
            root.appendChild(box);
        }
        if (failed) {
            if (root.dataset.kijiPaint === 'blocked' && box.querySelector('button')) return;
            root.dataset.kijiPaint = 'blocked';
            box.textContent = '页面暂时未能完整载入';
            const button = document.createElement('button');
            button.type = 'button'; button.textContent = '重新加载';
            button.onclick = function () { location.reload(); };
            box.appendChild(button);
        } else if (root.dataset.kijiPaint !== 'blocked') box.textContent = '正在打开…';
    };
    // A page may present its own loading screen (the pet cottage's pixel room):
    // it marks the element data-kiji-loading-screen, which stays visible while
    // the page is hidden, and hands it over here as soon as it is parsed. The
    // page keeps the transition up with a hold (which may wait for the reader,
    // e.g. an "enter" button), shows its own slow and retry states, and removes
    // its screen itself, so the watchdog stands down; resource failures and a
    // rejected hold still bring the reload screen.
    state.useScreen = function (screen) {
        state.screen = screen;
        clearTimeout(watchdog);
        if (root.dataset.kijiPaint !== 'blocked') document.getElementById('kiji-page-loading')?.remove();
    };
    function resourceError(event) {
        const target = event.target;
        if (target?.matches?.('link[rel~="stylesheet"]') && !target.disabled && (!target.media || matchMedia(target.media).matches) ||
            target?.tagName === 'SCRIPT' && /\/page-presentation\.js(?:\?|$)/.test(target.src)) {

    document.addEventListener('load', resourceLoaded, true);
    state.cancel = function () { clearTimeout(delay); clearTimeout(watchdog); document.removeEventListener('error', resourceError, true); document.removeEventListener('load', resourceLoaded, true); };
    delay = setTimeout(function () { state.status(state.failed); }, 600);

    watchdog = setTimeout(function () { state.status(true); }, 12000);
})();</script>

    <script>
        // --- 1. 模拟数据 (完形填空通常是一篇文章带有多个空) ---
        const clozeData = {
            id: "n2_reading_cloze_2025_07",
            title: "高齢者の外出支援",
            passage: `
                <div class="mb-5">
                    <p>現在、日本では65歳以上の<span class="annotation-word" data-explanation="年齢が高い人。一般に高い年齢層の人を指す">高齢者</span>が人口の約3割に達するほど<span class="annotation-word" data-explanation="社会全体で高齢者の割合が増えること">高齢化</span>が進んでいる。そんな日本で今、高齢者の体と心の健康のために外出を<span class="annotation-word" data-explanation="困っている人を助け、活動を支えること">支援</span>するサービスの重要性が増しているそうだ。このサービスには、どのような効果があるのだろうか。</p>
                    <p class="passage-translation hidden mt-2 text-textSub font-sans text-[0.95rem] font-normal leading-relaxed border-l-2 border-dashed border-borderDark pl-3 bg-gray-50/50 py-2 pr-2 rounded-r">目前，日本65岁以上的老年人已达到总人口约三成，人口老龄化程度不断加深。据说在这样的日本，为了老年人的身心健康，帮助他们外出的服务正变得越来越重要。这类服务究竟有什么效果呢？</p>
                </div>

                <div class="mb-5">
                    <p>外出を支援するサービスは、大きく分けて二つある。まず一つ目は、移動をサポートするサービスで、主に車での<span class="annotation-word" data-explanation="車で人を目的地まで送り、また迎えること">送迎</span>サービスだ。車の運転が<span class="annotation-word" data-explanation="難しく、簡単にはできないこと">困難</span>な人や、<span class="annotation-word" data-explanation="自分のいる場所からいちばん近いこと">最寄り</span>のバス停や駅まで歩くことが<span class="annotation-word" data-explanation="体や心にとって重荷になること">負担</span>になる人に[[48]]。二つ目は、外出の機会を提供するサービスだ。用事がないから外出しないという高齢者は[[49]]。そのため、商店街での割引を<span class="annotation-word" data-explanation="計画したことを実際に行うこと">実施</span>したり、集まっておしゃべりができる会を開いたりするなど、外出の目的や場所を提供している。これらのサービスにより、外出の回数が増えたという人も多いそうだ。</p>
                    <p class="passage-translation hidden mt-2 text-textSub font-sans text-[0.95rem] font-normal leading-relaxed border-l-2 border-dashed border-borderDark pl-3 bg-gray-50/50 py-2 pr-2 rounded-r">帮助外出的服务大致分为两类。第一类是协助移动的服务，主要是车辆接送。它<span class="text-accentRed font-bold">被</span>无法开车，或步行到最近公交站、车站会感到吃力的人<span class="text-accentRed font-bold">所使用</span>。第二类是提供外出机会的服务。据说因为没有事情而不外出的老年人<span class="text-accentRed font-bold">并不少</span>。因此，这些服务通过在商业街提供折扣、举办可以聚在一起聊天的活动等方式，为老年人提供外出的目的和场所。许多人借助这些服务增加了外出次数。</p>
                </div>

                <div class="mb-5">
                    <p>外出回数は、高齢者の体と心の健康に大きく影響する。[[50]]調査では、歩行に<span class="annotation-word" data-explanation="体の機能などに問題があり、行動が難しくなること">障害</span>が出た人の数は、外出回数が1日1回以上の人より3日に1回未満の人のほうが約4倍も多かった。また、外出は心の健康のために<span class="annotation-word" data-explanation="絶対に必要で、なくてはならないこと">欠かせない</span>という研究報告もある。外出によって脳に<span class="annotation-word" data-explanation="外から働きかけ、反応や活動を起こさせるもの">刺激</span>を与えることは、脳の<span class="annotation-word" data-explanation="物や体の部分が持つ働き">機能</span>が低下するのを防ぎ、心の健康につながるのだそうだ。</p>
                    <p class="passage-translation hidden mt-2 text-textSub font-sans text-[0.95rem] font-normal leading-relaxed border-l-2 border-dashed border-borderDark pl-3 bg-gray-50/50 py-2 pr-2 rounded-r">外出次数会对老年人的身心健康产生很大影响。<span class="text-accentRed font-bold">某项</span>调查显示，出现行走障碍的人数，在外出不足三天一次的人群中，约是每天至少外出一次人群的四倍。还有研究报告指出，外出对心理健康不可或缺。通过外出给大脑刺激，可以防止脑功能下降，并有助于心理健康。</p>
                </div>

                <div class="mb-5">
                    <p>外出と健康の関係を考えると、高齢者が外出することには大きな意味がある。高齢化が進む日本[[51]]、外出支援サービスは重要な<span class="annotation-word" data-explanation="ある目的のために果たす働きや役目">役割</span>を果たしているのだ。</p>
                    <p class="passage-translation hidden mt-2 text-textSub font-sans text-[0.95rem] font-normal leading-relaxed border-l-2 border-dashed border-borderDark pl-3 bg-gray-50/50 py-2 pr-2 rounded-r">考虑到外出与健康的关系，老年人外出具有重要意义。<span class="text-accentRed font-bold">在</span>老龄化不断加深的日本，外出支援服务正发挥着重要作用。</p>
                </div>

            `,
            questions: [
                {
                    id: "q48",
                    blankNum: 48,
                    isMultiBlank: false,
                    options: ["利用させてほしい", "利用されている", "利用してくれている", "利用してもいい"],
                    optionTranslations: ["希望允许使用。", "被……使用。", "有人特意使用着。", "可以使用。"],
                    optionExplanations: [
                        "「利用させてほしい」表示说话人希望别人允许自己使用，主语和意图都与客观介绍服务不符。",
                        "句子的主语是送迎服务，「人に利用されている」表示该服务被这些出行困难的人使用，结构和语义都完整。",
                        "「利用してくれている」需要使用者作主语，通常说「人が利用してくれている」；这里的助词「に」不能这样连接。",
                        "表示允许使用应说「人は／人が利用してもいい」，不能接在「人に」之后，且文章并非在说明许可。"
                    ],
                    correctIndex: 1
                },
                {
                    id: "q49",
                    blankNum: 49,
                    isMultiBlank: false,
                    options: ["少なかったはずだ", "少なくなったのだ", "少なくないという", "少なくなりかねない"],
                    optionTranslations: ["应该曾经很少。", "已经变少了。", "据说并不少。", "可能会变少。"],
                    optionExplanations: [
                        "「少なかったはずだ」是对过去情况的推测，后文却说明现在为何要提供外出目的，时间和逻辑都不合。",
                        "「少なくなったのだ」表示人数已经减少，与后文仍要解决“不外出”问题的内容相矛盾。",
                        "「少なくない」就是“并不少、数量很多”。后文用「そのため」承接并介绍解决措施，逻辑完整；「という」也与全文转述调查信息的语气一致。",
                        "「少なくなりかねない」表示今后可能减少，但服务针对的是目前已有的大量不外出老人，不是担心人数减少。"
                    ],
                    correctIndex: 2
                },
                {
                    id: "q50",
                    blankNum: 50,
                    isMultiBlank: false,
                    options: ["このような", "その", "次の", "ある"],
                    optionTranslations: ["这样的。", "那个；该项。", "下面的；下一项。", "某个；一项。"],
                    optionExplanations: [
                        "「このような調査」需要前文已经说明同类调查，但前文只概括外出影响健康，没有介绍具体调查。",
                        "「その調査」必须回指前文已出现的某项调查，而前面没有可以指代的调查。",
                        "「次の調査」表示下面将列出或展示一项调查，通常需要后续的项目、图表或列举；本文只是引入一个例证。",
                        "「ある調査では」表示“在某项调查中”，用于首次引入没有具体名称的调查，正好承接后面的调查结果。"
                    ],
                    correctIndex: 3
                },
                {
                    id: "q51",
                    blankNum: 51,
                    isMultiBlank: false,
                    options: ["において", "に限らず", "を中心に", "をはじめ"],
                    optionTranslations: ["在……之中；在……方面。", "不限于……。", "以……为中心。", "以……为首；从……开始。"],
                    optionExplanations: [
                        "「～において」表示事情发生或成立的场所、领域。这里是说在老龄化不断发展的日本，外出支援服务发挥重要作用。",
                        "「日本に限らず」意为“不仅限于日本”，后文需要继续说明其他国家或地区，但文中没有展开这种范围。",
                        "「日本を中心に」表示以日本为中心向其他范围扩展，文章只讨论日本，不存在扩展范围。",
                        "「日本をはじめ」意为“以日本为首还有其他对象”，后文同样需要列举或包含其他国家，与本文范围不符。"
                    ],
                    correctIndex: 0
                }
            ]
        };

        // --- 2. 状态管理 ---
        const state = {
            answers: {}, // 存储用户的选择 { 'q1': 1, 'q2': 0, ... }
            isSubmitted: false
        };

        // --- 3. DOM 渲染与初始化 ---
        function initApp() {
            renderPassage();
            renderQuestions();
            
            // 绑定提交按钮事件
            document.getElementById('submit-btn').addEventListener('click', handleSubmit);
            // 绑定译文开关事件
            document.getElementById('translation-toggle-btn').addEventListener('click', toggleTranslation);
            
            // 绑定全局点击事件，处理解释气泡
            document.addEventListener('click', handleGlobalClicks);
            // 滚动时隐藏气泡
            window.addEventListener('scroll', () => {
                const bubble = document.getElementById('global-annotation-bubble');
                if (bubble && bubble.classList.contains('is-visible')) {
                    bubble.classList.remove('is-visible');
                }
            }, { passive: true });
        }

        // 处理全局点击（包括气泡的显示与隐藏）
        function handleGlobalClicks(e) {
            const wordEl = e.target.closest('.annotation-word');
            const bubble = document.getElementById('global-annotation-bubble');
            
            if (wordEl) {
                // 获取自定义的解释内容
                bubble.textContent = wordEl.dataset.explanation;
                
                // 暂时显示气泡以获取准确宽高
                bubble.style.display = 'block';
                bubble.classList.add('is-visible');
                
                const wordRect = wordEl.getBoundingClientRect();
                
                // 初步计算气泡位置（相对页面坐标）
                let top = wordRect.bottom + window.scrollY + 8;
                let left = wordRect.left + window.scrollX;
                
                // 应用临时位置获取高度
                bubble.style.top = top + 'px';
                bubble.style.left = left + 'px';
                
                const bubbleRect = bubble.getBoundingClientRect();
                
                // 边界检测：防止气泡超出屏幕右侧
                if (left + bubbleRect.width > window.innerWidth - 16) {
                    left = window.innerWidth - bubbleRect.width - 16;
                }
                
                // 边界检测：防止气泡超出屏幕底部，如果超出则显示在词汇上方
                if (wordRect.bottom + bubbleRect.height + 16 > window.innerHeight) {
                    top = wordRect.top + window.scrollY - bubbleRect.height - 8;
                }
                
                // 设置最终安全位置
                bubble.style.top = top + 'px';
                bubble.style.left = left + 'px';
                
                e.stopPropagation();
            } else if (bubble && !bubble.contains(e.target)) {
                // 点击到气泡以外的地方，隐藏气泡
                bubble.classList.remove('is-visible');
            }
        }

        // 渲染文章，并将 [[1]] 或 [[1-a]] 替换为交互式槽位
        function renderPassage() {
            let html = clozeData.passage;
            
            // 替换联动多空格式 [[3-a]]
            html = html.replace(/\[\[(\d+)-([a-z])\]\]/g, (match, num, sub) => {
                const qId = `q${num}`;
                return `
                    <span class="cloze-blank-inline" data-qid="${qId}" data-sub="${sub}" onclick="scrollToQuestion('${qId}')">
                        <span class="cloze-blank-num">${num}-${sub}</span>
                        <span class="blank-text" id="slot-text-${qId}-${sub}"></span>
                    </span>
                `;
            });
            
            // 再替换普通单空格式 [[1]]
            html = html.replace(/\[\[(\d+)\]\]/g, (match, num) => {
                const qId = `q${num}`;
                return `
                    <span class="cloze-blank-inline" data-qid="${qId}" onclick="scrollToQuestion('${qId}')">
                        <span class="cloze-blank-num">${num}</span>
                        <span class="blank-text" id="slot-text-${qId}"></span>
                    </span>
                `;
            });

            document.getElementById('passage-container').innerHTML = html;
        }

        // 渲染下方的题目列表
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            let html = '';

            clozeData.questions.forEach(q => {
                // 生成选项
                let optionsHtml = '';
                q.options.forEach((opt, idx) => {
                    optionsHtml += `
                        <button class="cloze-option-btn focus:outline-none" data-qid="${q.id}" data-optidx="${idx}" onclick="handleOptionSelect('${q.id}', ${idx})">
                            <span class="option-marker">${idx + 1}</span>
                            <span class="font-bold text-textMain font-sans text-[0.95rem] option-text">${opt}</span>
                        </button>
                    `;
                });

                // 生成整道题の HTML，外层包裹 sketch-box
                html += `
                    <div id="question-block-${q.id}" class="sketch-box bg-white p-5 md:p-6 relative transition-colors duration-500">
                        <div class="mb-4 flex items-center justify-between border-b border-dashed border-borderMain pb-3 gap-3">
                            <h3 class="text-sm font-bold text-textSub tracking-wider flex-1">
                                （ ${q.blankNum} ）に入れるのに最もよいものを選びなさい。
                            </h3>
                            
                            <!-- 跳转回原文按钮 固定在右侧 -->
                            <div class="flex items-center gap-2 shrink-0">
                                <button onclick="scrollToPassageBlank('${q.id}')" class="text-xs font-bold text-textSub hover:text-textMain border border-borderMain hover:border-borderStrong px-3 py-1.5 sketch-btn bg-gray-50 transition-colors flex items-center gap-1">
                                    ↑ 原文の（ ${q.blankNum} ）へ
                                </button>
                                <span id="badge-${q.id}" class="hidden text-sm font-bold tracking-widest px-2 py-1 sketch-btn"></span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-2">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // --- 4. 交互逻辑 ---

        // 译文开关切换逻辑
        let isTranslationVisible = false;
        function toggleTranslation() {
            if (!state.isSubmitted) return; // 未提交前不可切换

            isTranslationVisible = !isTranslationVisible;
            const btn = document.getElementById('translation-toggle-btn');
            const span = btn.querySelector('span');
            const eyeIcon = btn.querySelector('.eye-icon');

            if (isTranslationVisible) {
                span.textContent = '訳文：ON';
                btn.classList.add('bg-blue-50');
                btn.classList.remove('bg-yellow-50');
                // 闭眼图标 (eye-off)
                eyeIcon.innerHTML = `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>`;

                document.querySelectorAll('.passage-translation').forEach(el => {
                    el.classList.remove('hidden');
                    el.classList.add('fade-in');
                });
            } else {
                span.textContent = '訳文：OFF';
                btn.classList.remove('bg-blue-50');
                btn.classList.add('bg-yellow-50');
                // 睁眼图标 (eye)
                eyeIcon.innerHTML = `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>`;

                document.querySelectorAll('.passage-translation').forEach(el => {
                    el.classList.add('hidden');
                    el.classList.remove('fade-in');
                });
            }
        }

        // 点击选项
        function handleOptionSelect(qId, optIdx) {
            if (state.isSubmitted) return; // 提交后不可修改

            // 1. 更新状态
            state.answers[qId] = optIdx;

            // 2. 更新题目区的 UI (高亮选中项)
            const block = document.getElementById(`question-block-${qId}`);
            const buttons = block.querySelectorAll('.cloze-option-btn');
            buttons.forEach(btn => btn.classList.remove('is-selected'));
            buttons[optIdx].classList.add('is-selected');

            // 3. 更新文章区填空槽位的 UI
            const targetQuestion = clozeData.questions.find(q => q.id === qId);
            const selectedOptText = targetQuestion.options[optIdx];
            
            if (targetQuestion.isMultiBlank) {
                // 如果是多空题，如 "a 血液型 / b 性格 / c 性格"
                // 按照 "/" 拆分，并去除前缀如 "a " 和 "b "
                const parts = selectedOptText.split('/');
                const fills = parts.map(p => p.trim().replace(/^[a-zａ-ｚ][\s　]+/i, ''));
                
                targetQuestion.subBlanks.forEach((sub, i) => {
                    const slot = document.querySelector(`.cloze-blank-inline[data-qid="${qId}"][data-sub="${sub}"]`);
                    const slotText = document.getElementById(`slot-text-${qId}-${sub}`);
                    if (slot && slotText && fills[i] !== undefined) {
                        slotText.textContent = fills[i];
                        slot.classList.add('is-filled');
                    }
                });
            } else {
                // 普通单空题
                const slot = document.querySelector(`.cloze-blank-inline[data-qid="${qId}"]`);
                const slotText = document.getElementById(`slot-text-${qId}`);
                if (slot && slotText) {
                    slotText.textContent = selectedOptText;
                    slot.classList.add('is-filled');
                }
            }

            // 4. 检查是否所有题目都已作答，决定是否点亮提交按钮
            checkSubmitStatus();
        }

        // [功能1]: 点击文章槽位 -> 滚动到对应题目
        function scrollToQuestion(qId) {
            const targetBlock = document.getElementById(`question-block-${qId}`);
            if (targetBlock) {
                // 平滑滚动并稍作偏移避免被导航栏遮挡
                const y = targetBlock.getBoundingClientRect().top + window.scrollY - 80;
                window.scrollTo({ top: y, behavior: 'smooth' });
                
                // 给予一個瞬間の背景高亮提示
                targetBlock.classList.remove('flash-highlight');
                void targetBlock.offsetWidth; // 触发重绘
                targetBlock.classList.add('flash-highlight');
            }
        }

        // [功能2]: 点击题目里的按钮 -> 滚动回文章槽位
        function scrollToPassageBlank(qId) {
            // 如果是多空题，滚动到第一个子空即可；如果是单空，滚动到主空
            const targetSlot = document.querySelector(`.cloze-blank-inline[data-qid="${qId}"]`);
            if (targetSlot) {
                // 平滑滚动并稍作偏移避免被顶部栏遮挡
                const y = targetSlot.getBoundingClientRect().top + window.scrollY - 150;
                window.scrollTo({ top: y, behavior: 'smooth' });
                
                // 给文章空隙增加闪烁动画 (如果有多空，最好把同题号的都闪一下)
                const allSlotsForQ = document.querySelectorAll(`.cloze-blank-inline[data-qid="${qId}"]`);
                allSlotsForQ.forEach(slot => {
                    slot.classList.remove('flash-highlight');
                    void slot.offsetWidth; // 触发重绘
                    slot.classList.add('flash-highlight');
                });
            }
        }

        // 检查是否全部答完
        function checkSubmitStatus() {
            const answeredCount = Object.keys(state.answers).length;
            const totalCount = clozeData.questions.length;
            const btn = document.getElementById('submit-btn');
            
            if (answeredCount === totalCount) {
                btn.disabled = false;
                btn.textContent = '採点する（批改）';
            } else {
                btn.disabled = true;
                btn.textContent = `解答中 (${answeredCount}/${totalCount})`;
            }
        }

        // 提交批改，并生成结算页面
        function handleSubmit() {
            state.isSubmitted = true;
            document.getElementById('bottom-action-area').style.display = 'none'; // 隐藏提交按钮区
            
            let correctCount = 0;
            const resultSection = document.getElementById('result-section');
            let summaryGridHtml = ''; // 用于存放结算面板中的各个题目标记

            clozeData.questions.forEach(q => {
                const userAns = state.answers[q.id];
                const isCorrect = userAns === q.correctIndex;
                const slots = document.querySelectorAll(`.cloze-blank-inline[data-qid="${q.id}"]`);
                const badge = document.getElementById(`badge-${q.id}`);
                const block = document.getElementById(`question-block-${q.id}`);

                // 禁用所有选项按钮
                block.querySelectorAll('.cloze-option-btn').forEach(btn => btn.style.pointerEvents = 'none');

                if (isCorrect) {
                    correctCount++;
                    // 文章槽位变绿 (单空和多空通用)
                    slots.forEach(slot => slot.classList.add('judged-correct'));
                    
                    // 题目标签变绿
                    badge.textContent = "正解";
                    badge.className = "text-sm font-bold tracking-widest px-2 py-1 sketch-btn border border-green-500 bg-green-50 text-green-600 inline-block";
                    
                    // 结算面板：绿色块 (精简版胶囊)
                    summaryGridHtml += `
                        <div class="px-3 py-1.5 sketch-btn border-green-500 bg-green-50 text-green-600 font-bold text-sm flex items-center gap-1 shrink-0">
                            （${q.blankNum}） <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                    `;

                } else {
                    // 文章槽位变红并画删除线
                    slots.forEach(slot => slot.classList.add('judged-wrong'));
                    
                    // 题目标签变红
                    badge.textContent = "不正解";
                    badge.className = "text-sm font-bold tracking-widest px-2 py-1 sketch-btn border border-accentRed bg-red-50 text-accentRed inline-block";
                    
                    // 将选错的按钮变成错误红样式
                    if (userAns !== undefined) {
                        block.querySelectorAll('.cloze-option-btn')[userAns].classList.add('is-wrong-answer');
                    }

                    // 结算面板：红色可点击块 (精简版胶囊)
                    summaryGridHtml += `
                        <button onclick="scrollToQuestion('${q.id}')" title="点击查看解析" class="px-3 py-1.5 sketch-btn border-accentRed bg-red-50 text-accentRed font-bold text-sm hover:bg-red-100 transition-colors cursor-pointer flex items-center gap-1 shrink-0">
                            （${q.blankNum}） <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    `;
                }

                // --- 新增：无论对错，直接将正确的选项高亮为绿色 ---
                const correctOptionBtn = block.querySelectorAll('.cloze-option-btn')[q.correctIndex];
                // 移除选中状态以防冲突
                correctOptionBtn.classList.remove('is-selected'); 
                correctOptionBtn.classList.add('is-correct-answer');

            });

            // 激活右上角的译文开关
            const transToggleBtn = document.getElementById('translation-toggle-btn');
            if (transToggleBtn) {
                transToggleBtn.disabled = false;
                transToggleBtn.classList.remove('bg-gray-100', 'text-textMuted', 'cursor-not-allowed');
                transToggleBtn.classList.add('bg-yellow-50', 'text-textMain', 'cursor-pointer', 'hover:bg-yellow-100');
            }

            // 渲染并显示底部的精简版结算面板
            const total = clozeData.questions.length;
            const isPerfect = correctCount === total;
            
            resultSection.innerHTML = `
                <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-5">
                    <div class="flex items-center gap-4 shrink-0">
                        <div class="flex items-center justify-center w-10 h-10 rounded-full ${isPerfect ? 'bg-green-100 text-green-600' : 'bg-red-100 text-accentRed'}">
                            ${isPerfect ? '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>'}
                        </div>
                        <div>
                            <div class="text-sm font-bold text-textSub tracking-wider mb-0.5">採点結果</div>
                            <div class="text-3xl font-sans font-bold ${isPerfect ? 'text-green-500' : 'text-accentRed'} leading-none">
                                ${correctCount} <span class="text-lg text-textMuted">/ ${total}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 border-t md:border-t-0 md:border-l border-dashed border-borderMain pt-4 md:pt-0 md:pl-6 w-full md:w-auto flex-1">
                        ${summaryGridHtml}
                    </div>
                </div>
            `;
            
            resultSection.classList.remove('hidden');

            // 平滑滚动到底部的结算面板
            setTimeout(() => {
                const y = resultSection.getBoundingClientRect().top + window.scrollY - 100;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }, 100);
        }

        // 页面加载完毕后初始化
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
