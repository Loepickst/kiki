<script>(function bootstrap() {
    const root = document.documentElement;
    (window.KijiPagePresentation?.dispose || window.KijiPagePresentation?.cancel)?.();
    root.dataset.kijiPaint = 'pending';
    const state = window.KijiPagePresentation = { root, startedAt: performance.now(), failedStyles: new WeakSet() };
    let delay, watchdog;
    state.status = function (failed) {
        if (document.documentElement !== root || root.dataset.kijiPaint === 'ready') return;
        // A page showing its own loading screen keeps it; only failure covers it.
        if (!failed && state.screen && root.dataset.kijiPaint !== 'blocked') return;
        let box = document.getElementById('kiji-page-loading');
        if (!box) {
            box = document.createElement('div');
            box.id = 'kiji-page-loading';
            box.setAttribute('role', 'status');
            // A blocking head script may prevent body from existing at all.
            // Keep the retry layer outside it so even that case stays recoverable.
            root.appendChild(box);
        }
        if (failed) {
            if (root.dataset.kijiPaint === 'blocked' && box.querySelector('button')) return;
            root.dataset.kijiPaint = 'blocked';
            box.textContent = '页面暂时未能完整载入';
            const button = document.createElement('button');
            button.type = 'button'; button.textContent = '重新加载';
            button.onclick = function () { location.reload(); };
            box.appendChild(button);
        } else if (root.dataset.kijiPaint !== 'blocked') box.textContent = '正在打开…';
    };
    // A page may present its own loading screen (the pet cottage's pixel room):
    // it marks the element data-kiji-loading-screen, which stays visible while
    // the page is hidden, and hands it over here as soon as it is parsed. The
    // page keeps the transition up with a hold (which may wait for the reader,
    // e.g. an "enter" button), shows its own slow and retry states, and removes
    // its screen itself, so the watchdog stands down; resource failures and a
    // rejected hold still bring the reload screen.
    state.useScreen = function (screen) {
        state.screen = screen;
        clearTimeout(watchdog);
        if (root.dataset.kijiPaint !== 'blocked') document.getElementById('kiji-page-loading')?.remove();
    };
    function resourceError(event) {
        const target = event.target;
        if (target?.matches?.('link[rel~="stylesheet"]') && !target.disabled && (!target.media || matchMedia(target.media).matches) ||

    document.addEventListener('load', resourceLoaded, true);

    watchdog = setTimeout(function () { state.status(true); }, 12000);

    <script>
        const partMeta = {
            "kanji-reading": {
                title: "第一大题：汉字读音",
                subtitle: "选择词性分类后，将进入对应的读音真题练习。"
            },
            blank: {
                title: "第二题：填空",
                subtitle: "选择词性分类后，将进入对应的语境填空真题练习。"
            },
            "synonym-meaning": {
                title: "第三题：近义 / 释义",
                subtitle: "选择词性分类后，将进入对应的近义与释义辨析练习。"
            },
            usage: {
                title: "第四题：用法判断",
                subtitle: "选择词性分类后，将进入对应的用法判断真题练习。"
            }
        };

        const typeView = document.getElementById("type-view");
        const categoryView = document.getElementById("category-view");
        const pageTitle = document.getElementById("page-title");
        const categoryTitle = document.getElementById("category-title");
        const categorySubtitle = document.getElementById("category-subtitle");
        const backBtn = document.getElementById("back-btn");
        const categoryGrid = document.getElementById("category-grid");
        const categoryReviewChip = document.getElementById("category-review-chip");
        const questions = Array.isArray(window.N1_PAST_VOCAB_QUESTIONS) ? window.N1_PAST_VOCAB_QUESTIONS : [];
        const reviewStore = window.N1PastVocabReviewStore || null;
        const initialPartId = new URLSearchParams(window.location.search).get("part");
        let currentPartId = null;
        const groupSizeByPart = {
            blank: 15
        };
        const categoryDefs = [
            { id: "noun", icon: "名", title: "名词" },
            { id: "adjective", icon: "形", title: "形容词" },
            { id: "verb", icon: "動", title: "动词" },
            { id: "adverb", icon: "副", title: "副词" },
            { id: "mimetic", icon: "擬", title: "拟声拟态" },
            { id: "loanword", icon: "外", title: "外来语" }
        ];

        function getCount(partId, categoryId) {
            return questions.filter(function(question) {
                return question.part === partId && question.category === categoryId;
            }).length;
        }

        function getGroupSize(partId) {
            return groupSizeByPart[partId] || 20;
        }

        function getGroupCount(partId, count) {
            return Math.max(1, Math.ceil(count / getGroupSize(partId)));
        }

        function getProgressKey(partId, categoryId) {
            return `n1PastVocabGroupProgress::${partId}::${categoryId}`;
        }

        function getCompletedGroups(partId, categoryId) {
            try {
                const raw = localStorage.getItem(getProgressKey(partId, categoryId));
                const parsed = raw ? JSON.parse(raw) : null;
                return new Set(Array.isArray(parsed?.completedSets) ? parsed.completedSets.map(Number) : []);
            } catch (error) {
                return new Set();
            }
        }

        function getReviewCount(partId) {
            return reviewStore ? reviewStore.getCount(partId) : 0;
        }

        function updateCategoryReviewChip(partId) {
            const reviewCount = getReviewCount(partId);
            categoryReviewChip.classList.toggle("hidden", reviewCount <= 0);
            categoryReviewChip.textContent = `错题 ${reviewCount}`;
            categoryReviewChip.dataset.reviewPart = partId || "";
            categoryReviewChip.setAttribute("aria-label", `复习${partMeta[partId]?.title || "当前大题"}错题，共 ${reviewCount} 题`);
        }

        function updateCategoryCards(partId) {
            const entries = categoryDefs
                .map(function(category) {
                    return { ...category, count: getCount(partId, category.id) };
                })
                .filter(function(category) {
                    return category.count > 0;
                });

            categoryGrid.innerHTML = entries.map(function(category) {
                const groupCount = getGroupCount(partId, category.count);
                const completedCount = [...getCompletedGroups(partId, category.id)].filter(function(setNumber) {
                    return setNumber >= 1 && setNumber <= groupCount;
                }).length;
                const isComplete = completedCount >= groupCount;
                const tagText = isComplete ? "已完成" : `${groupCount} 组`;
                const tagClass = isComplete ? " tag-complete" : "";
                const groupSize = getGroupSize(partId);
                const progressText = completedCount > 0
                    ? `已完成 ${completedCount} / ${groupCount} 组，点击继续未完成组。`
                    : `每组 ${groupSize} 题，共 ${groupCount} 组，点击开始练习。`;
                return `
                    <button class="lesson-item category-card" type="button" data-category="${category.id}">
                        <span class="lesson-content">
                            <span class="lesson-icon">${category.icon}</span>
                            <span class="lesson-text">
                                <h3>${category.title}</h3>
                                <p>已整理 ${category.count} 道真题。${progressText}</p>
                            </span>
                        </span>
                        <span class="lesson-tag${tagClass}">${tagText}</span>
                    </button>
                `;
            }).join("");
        }

        function showTypeView() {
            typeView.classList.remove("hidden");
            categoryView.classList.add("hidden");
            pageTitle.textContent = "N1 真题词汇练习";
            currentPartId = null;
            categoryReviewChip.classList.add("hidden");
            categoryReviewChip.dataset.reviewPart = "";
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function showCategoryView(partId) {
            const meta = partMeta[partId];
            if (!meta) return;
            currentPartId = partId;
            categoryTitle.textContent = meta.title;
            categorySubtitle.textContent = meta.subtitle;
            updateCategoryCards(partId);
            updateCategoryReviewChip(partId);
            pageTitle.textContent = meta.title;
            typeView.classList.add("hidden");
            categoryView.classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        document.querySelectorAll("[data-part]").forEach(function(button) {
            button.addEventListener("click", function() {
                showCategoryView(button.dataset.part);
            });
        });

        categoryReviewChip.addEventListener("click", function() {
            const partId = categoryReviewChip.dataset.reviewPart;
            if (!partId) return;
            window.location.href = `practice_n1_past_vocab.html?mode=review&part=${encodeURIComponent(partId)}`;
        });

        categoryGrid.addEventListener("click", function(event) {
            const card = event.target.closest("[data-category]");
            if (!currentPartId || !card) return;
            const categoryId = card.dataset.category;
            window.location.href = `practice_n1_past_vocab.html?part=${encodeURIComponent(currentPartId)}&category=${encodeURIComponent(categoryId)}`;
        });

        backBtn.addEventListener("click", function(event) {
            if (!categoryView.classList.contains("hidden")) {
                event.preventDefault();
                showTypeView();
            }
        });

        if (initialPartId && partMeta[initialPartId]) {
            showCategoryView(initialPartId);
        }
    </script>
