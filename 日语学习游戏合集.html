<script>(function bootstrap() {
    const root = document.documentElement;
    (window.KijiPagePresentation?.dispose || window.KijiPagePresentation?.cancel)?.();
    root.dataset.kijiPaint = 'pending';
    const state = window.KijiPagePresentation = { root, startedAt: performance.now(), failedStyles: new WeakSet() };
    let delay, watchdog;
    state.status = function (failed) {
        if (document.documentElement !== root || root.dataset.kijiPaint === 'ready') return;
        // A page showing its own loading screen keeps it; only failure covers it.
        if (!failed && state.screen && root.dataset.kijiPaint !== 'blocked') return;
        let box = document.getElementById('kiji-page-loading');
        if (!box) {
            box = document.createElement('div');
            box.id = 'kiji-page-loading';
            box.setAttribute('role', 'status');
            // A blocking head script may prevent body from existing at all.
            // Keep the retry layer outside it so even that case stays recoverable.
            root.appendChild(box);
        }
        if (failed) {
            if (root.dataset.kijiPaint === 'blocked' && box.querySelector('button')) return;
            root.dataset.kijiPaint = 'blocked';
            box.textContent = '页面暂时未能完整载入';
            const button = document.createElement('button');
            button.type = 'button'; button.textContent = '重新加载';
            button.onclick = function () { location.reload(); };
            box.appendChild(button);
        } else if (root.dataset.kijiPaint !== 'blocked') box.textContent = '正在打开…';
    };
    // A page may present its own loading screen (the pet cottage's pixel room):
    // it marks the element data-kiji-loading-screen, which stays visible while
    // the page is hidden, and hands it over here as soon as it is parsed. The
    // page keeps the transition up with a hold (which may wait for the reader,
    // e.g. an "enter" button), shows its own slow and retry states, and removes
    // its screen itself, so the watchdog stands down; resource failures and a
    // rejected hold still bring the reload screen.
    state.useScreen = function (screen) {
        state.screen = screen;
        clearTimeout(watchdog);
        if (root.dataset.kijiPaint !== 'blocked') document.getElementById('kiji-page-loading')?.remove();
    };
    function resourceError(event) {
        const target = event.target;
        if (target?.matches?.('link[rel~="stylesheet"]') && !target.disabled && (!target.media || matchMedia(target.media).matches) ||

    watchdog = setTimeout(function () { state.status(true); }, 12000);
})();</script>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>

    .entry-record strong{display:block;margin-top:4px;font:700 31px/1 var(--serif);letter-spacing:0;color:var(--ink)}

    .return-button{position:absolute;z-index:4;left:max(13px,env(safe-area-inset-left));top:max(13px,env(safe-area-inset-top));height:42px;padding:0 17px;border:1px solid rgba(255,255,255,.3);border-radius:22px;background:rgba(18,15,18,.84);backdrop-filter:blur(8px);color:#fff;font:800 12px/1 var(--sans);letter-spacing:.08em;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.2)}
    .return-button:hover{background:#29212a}.return-button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

    @media(max-width:640px){
      .selection-view{place-items:start center;padding:22px 14px max(18px,env(safe-area-inset-bottom))}
      .collection-back-button{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));min-height:36px;padding:0 12px;font-size:11px}
      .selection-shell{margin:auto 0}.collection-header{margin-bottom:22px}.collection-mark{width:43px;height:43px;margin-bottom:13px}.collection-mark span{font-size:14px}.eyebrow{font-size:9px}.main-title{font-size:37px;margin-top:10px}.subtitle{font-size:10px;margin-top:10px}
      .game-list{gap:9px}.game-entry{min-height:104px;grid-template-columns:46px minmax(0,1fr) auto;gap:13px;padding:16px 14px;border-left-width:4px}.entry-number{width:40px;height:40px;font-size:14px}.entry-meta{font-size:9px;margin-bottom:6px}.entry-title{font-size:23px}.entry-description{font-size:10px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry-record{min-width:73px;padding-left:12px;font-size:8px}.entry-record strong{font-size:24px}.entry-arrow{display:none}.key-guide{margin-top:16px;font-size:9px}.return-button{height:38px;padding:0 14px;font-size:11px}
    }
    @media(max-height:680px){
      .selection-view{padding-top:16px}.collection-header{margin-bottom:16px}.collection-mark{display:none}.main-title{font-size:34px}.subtitle{margin-top:8px}.game-entry{min-height:88px;padding-top:12px;padding-bottom:12px}.entry-description{margin-top:5px}.key-guide{margin-top:12px}
    }

<body>
  <main class="selection-view" id="selectionView">
    <a class="collection-back-button" href="index.html" aria-label="返回主页"><span class="collection-back-arrow" aria-hidden="true">←</span><span>返回主页</span></a>
    <div class="selection-shell">
      <header class="collection-header">
        <div class="collection-mark" aria-hidden="true"><span>遊</span></div>
        <p class="eyebrow">学びを、遊びに。</p>
        <h1 class="main-title">日本語遊戯場</h1>
        <p class="subtitle">稽古を選ぶ</p>
      </header>

      <section class="game-list" aria-label="ゲーム選択"></section>
      <p class="key-guide">↑ ↓ 選ぶ　・　Enter 決定</p>
    </div>
  </main>

  <section class="game-stage" id="gameStage" hidden>
    <button class="return-button" id="returnButton" type="button" hidden>← 退場</button>
    <iframe class="game-frame" id="gameFrame" title="選択した日本語ゲーム"></iframe>
    <div class="stage-loader" id="stageLoader">読込中</div>
  </section>

  <script src="shared/game-catalog-github-20261020.js?v=katakana-20261017"></script>
  <script>
    (()=>{
      'use strict';
      const games=globalThis.KikiGameCatalog.games;
      const list=document.querySelector('.game-list');
      function element(tag,className,text){const node=document.createElement(tag);node.className=className;if(text!==undefined)node.textContent=text;return node;}
      for(const [index,game] of games.entries()){
        const entry=element('button','game-entry');entry.type='button';entry.dataset.index=String(index);entry.dataset.game=game.id;entry.style.setProperty('--accent',game.accent);entry.setAttribute('aria-pressed','false');
        const copy=element('span','entry-copy');copy.append(element('span','entry-meta',game.practice),element('strong','entry-title',game.title),element('span','entry-description',game.description));
        const record=element('span','entry-record','自己最高'),score=element('strong','','0');score.dataset.score=String(index);score.append(element('small','','点'),element('span','entry-arrow','→'));record.append(score);
        entry.append(element('span','entry-number',game.number),copy,record);list.append(entry);
      }
      const entries=[...document.querySelectorAll('.game-entry')];
      const selection=document.getElementById('selectionView'),stage=document.getElementById('gameStage'),frame=document.getElementById('gameFrame'),loader=document.getElementById('stageLoader'),returnButton=document.getElementById('returnButton');
      let selected=0,viewObserver=null;
      function readScore(key){try{return Math.max(0,Number.parseInt(localStorage.getItem(key)||'0',10)||0)}catch{return 0}}
      function refreshScores(){games.forEach((game,index)=>{const target=document.querySelector(`[data-score="${index}"]`);target.firstChild.nodeValue=String(readScore(game.scoreKey))})}
      function select(index,focus=false){selected=(index+games.length)%games.length;entries.forEach((entry,i)=>{const active=i===selected;entry.classList.toggle('is-selected',active);entry.setAttribute('aria-pressed',String(active))});if(focus)entries[selected].focus({preventScroll:true})}
      function findHomeView(doc){return doc?.getElementById('homeView')||doc?.querySelector('[data-game-view="home"]')}
      // Never hide the escape route merely because a file:// frame is opaque.
      function syncReturnButton(){try{const doc=frame.contentDocument,home=findHomeView(doc),bodyView=doc?.body?.dataset.view;if(!home)return;const onHome=bodyView?bodyView==='home':!home.hidden;returnButton.hidden=!onHome}catch{/* Keep the last reported state. */}}
      function watchGameView(){viewObserver?.disconnect();viewObserver=null;frame.contentWindow?.postMessage({type:'kiki:request-game-navigation'},'*');try{const doc=frame.contentDocument,home=findHomeView(doc);if(!doc||!home)return;viewObserver=new MutationObserver(syncReturnButton);viewObserver.observe(home,{attributes:true,attributeFilter:['hidden','class']});if(doc.body)viewObserver.observe(doc.body,{attributes:true,attributeFilter:['data-view']});syncReturnButton()}catch{/* The child bridge handles opaque local-file frames. */}}
      window.addEventListener('message',event=>{if(stage.hidden||event.source!==frame.contentWindow||event.data?.type!=='kiki:game-navigation'||typeof event.data.onHome!=='boolean')return;returnButton.hidden=!event.data.onHome});
      function openGame(index=selected){select(index);const game=games[selected];viewObserver?.disconnect();viewObserver=null;returnButton.hidden=false;loader.classList.remove('is-done');frame.title=game.title;selection.hidden=true;stage.hidden=false;frame.src=game.path;document.title=`${game.title}｜日本語遊戯場`}
      function closeGame(){viewObserver?.disconnect();viewObserver=null;returnButton.hidden=true;frame.removeAttribute('src');stage.hidden=true;selection.hidden=false;document.title='日本語遊戯場｜稽古選択';refreshScores();select(selected,true)}
      entries.forEach((entry,index)=>{entry.addEventListener('pointerenter',()=>select(index));entry.addEventListener('focus',()=>select(index));entry.addEventListener('click',()=>openGame(index))});
      returnButton.onclick=closeGame;frame.addEventListener('load',()=>{loader.classList.add('is-done');watchGameView()});
      document.addEventListener('keydown',event=>{if(!stage.hidden){if(event.key==='Escape')closeGame();return}if(event.key==='ArrowUp'){event.preventDefault();select(selected-1,true)}else if(event.key==='ArrowDown'){event.preventDefault();select(selected+1,true)}else if(event.key==='Enter'){event.preventDefault();openGame()}});
      refreshScores();select(0);
    })();
  </script>
