<!doctype html>
<!-- 敬語道場题库由 test/keigo.html 的分类、特殊动词与人物关系题迁移重整，并补充 N2 普通形⇄敬语转换及高频构式题；主站原练习保持不变。 -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#eee8da">
  <title>敬語道場｜敬語判断の稽古</title>
  <style>
    :root{
      --ink:#181915;--muted:#716e65;--red:#a33e31;--red-dark:#71281f;
      --paper:#fbf8f0;--paper-deep:#eee8da;--wood:#33231d;--wood-soft:#5c4033;
      --tatami:#a9a06c;--green:#657147;--gold:#b48a32;--shoji:#efe8da;--wood-dark:#281b16;--line:rgba(50,43,34,.14);
      --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
      --cn:"Heiti SC",SimHei,"Hiragino Sans GB","Microsoft YaHei",sans-serif;
      --serif:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
      --brush:"Yuji Syuku","Klee One","Yu Mincho","Hiragino Mincho ProN",serif;
      --display:var(--serif);--jp-ui:var(--sans);
      color-scheme:light;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e7e0d2;color:var(--ink)}
    body{font-family:var(--serif);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    button,input{font:inherit}
    button{color:inherit}
    [hidden]{display:none!important}
    .zh{font-family:var(--cn)}
    .view{position:absolute;inset:0;overflow:hidden}

    .room-bg{
      background:
        linear-gradient(to bottom,rgba(74,47,35,.92) 0 20px,transparent 20px),
        repeating-linear-gradient(90deg,transparent 0 13.8%,rgba(72,59,47,.12) 13.8% 14.35%,transparent 14.35% 28%),
        repeating-linear-gradient(0deg,transparent 0 31.5%,rgba(72,59,47,.11) 31.5% 32.25%,transparent 32.25% 64%),
        linear-gradient(to bottom,#f3eedf 0 76%,#a9a06c 76% 100%);
    }
    .room-bg:after{content:"";position:absolute;left:0;right:0;bottom:23.8%;height:10px;background:var(--wood);opacity:.86}

    .home-view{display:flex;align-items:center;justify-content:center;padding:54px 6vw 42px}
    .home-layout{width:min(1540px,100%);height:min(790px,82vh);display:grid;grid-template-columns:minmax(340px,.83fr) minmax(470px,1fr);gap:7vw;align-items:center;position:relative;z-index:1}
    .home-mascot{height:100%;margin:0;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 24px 18px rgba(38,25,18,.20))}
    .home-mascot img{display:block;width:min(610px,100%);max-height:92%;object-fit:contain;object-position:center bottom}
    .scroll-panel{height:min(720px,82vh);position:relative;padding:58px 72px;display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center;background:rgba(252,249,242,.965);border-left:12px solid var(--wood);border-right:12px solid var(--wood);box-shadow:0 24px 54px rgba(42,29,22,.18)}
    .scroll-panel:before,.scroll-panel:after{content:"";position:absolute;left:-24px;right:-24px;height:30px;border-radius:13px;background:linear-gradient(90deg,#2c1d18,#69483a 45%,#2e201a);box-shadow:0 6px 12px rgba(38,24,18,.22)}
    .scroll-panel:before{top:-15px}.scroll-panel:after{bottom:-15px}
    .home-kicker{font:700 15px/1.3 var(--sans);letter-spacing:.22em;color:var(--red);margin-bottom:18px}
    .home-title{font:900 clamp(58px,7vw,112px)/.96 var(--serif);letter-spacing:.03em;margin:0}
    .home-subtitle{font:700 18px/1.4 var(--sans);letter-spacing:.32em;color:var(--red-dark);margin:20px 0 34px}
    .home-description{font:500 17px/1.9 var(--sans);color:var(--muted);margin:0 auto 38px;max-width:590px}
    .primary-button{height:88px;border:0;background:linear-gradient(180deg,#2e201b,#201714);color:#fff;font:800 21px/1 var(--sans);letter-spacing:.08em;cursor:pointer;box-shadow:0 9px 0 rgba(55,39,31,.14);transition:transform .18s ease,filter .18s ease}
    .primary-button:hover{filter:brightness(1.08)}.primary-button:active{transform:translateY(3px)}
    .primary-button .arrow{font-size:30px;margin-left:45px;font-weight:400}
    .best-plaque{height:78px;margin-top:16px;border:4px double rgba(75,51,41,.62);display:flex;align-items:center;justify-content:center;gap:11px;background:rgba(255,255,255,.36);font:700 15px/1 var(--sans);letter-spacing:.08em;color:#68655e}
    .best-plaque strong{font:500 46px/1 var(--serif);color:var(--ink)}
    .text-button{align-self:center;border:0;border-bottom:1px solid currentColor;background:none;color:#77736a;font:500 16px/1.5 var(--serif);margin-top:26px;padding:0 2px;cursor:pointer}
    .settings-button{position:fixed;z-index:20;top:32px;right:34px;width:64px;height:64px;border:2px solid #4c443e;border-radius:50%;background:rgba(252,250,244,.95);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px rgba(35,27,23,.13)}
    .settings-button svg{width:34px;height:34px}
    .settings-button:after{content:"";position:absolute;right:6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--red)}

    .countdown-view,.ending-view{display:grid;place-items:center;background:var(--paper);text-align:center;z-index:30}
    .countdown-inner{position:relative}.countdown-ready{height:36px;font:700 18px/1 var(--sans);letter-spacing:.28em;color:var(--red)}
    .countdown-number{font:900 clamp(110px,20vw,230px)/1 var(--serif);min-width:280px}
    .countdown-number.is-pop{animation:countPop .72s cubic-bezier(.16,1,.3,1)}
    .countdown-number.is-start{font-size:clamp(72px,12vw,144px);letter-spacing:.08em}
    @keyframes countPop{0%{opacity:0;transform:scale(.35) rotate(-8deg)}50%{opacity:1;transform:scale(1.08) rotate(1deg)}100%{transform:scale(1)}}

    .practice-view{background-color:#f8f5ed;background-image:radial-gradient(circle at 50% 48%,rgba(255,255,255,.95),rgba(255,255,255,0) 49%),repeating-radial-gradient(circle at 0 100%,transparent 0 42px,rgba(109,119,79,.075) 43px 46px,transparent 47px 84px);border:3px solid #20221b}
    .practice-shell{height:100%;display:grid;grid-template-rows:80px minmax(0,1fr) auto;position:relative}
    .hud{width:min(1240px,74vw);margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;font:700 15px/1 var(--sans);position:relative;z-index:5}
    .hud-item{display:flex;justify-content:center;align-items:baseline;gap:9px;color:#5f6159;letter-spacing:.08em}
    .hud-item strong{font:800 33px/1 var(--sans);color:var(--ink);letter-spacing:0}.hud-item small{font-size:12px}
    .hud-item:first-child{justify-content:flex-start}.hud-item:last-child{justify-content:flex-end}
    .hud-time.is-urgent strong{color:var(--red);animation:urgent .7s infinite alternate}
    @keyframes urgent{to{transform:scale(1.1)}}
    .question-zone{min-height:0;padding:34px 170px 16px;display:flex;align-items:center;justify-content:center;position:relative}
    .question-card{--approach:0;--time-progress:0;position:relative;width:min(870px,72vw);height:min(480px,55vh);min-height:330px;border:1px solid rgba(50,46,38,.11);border-radius:28px;background:rgba(255,253,248,.96);box-shadow:0 20px 48px rgba(57,47,36,.12),0 0 calc(22px * var(--approach)) rgba(143,54,43,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 60px;transform:scale(calc(.92 + var(--approach) * .075));transition:box-shadow .12s linear;overflow:hidden}
    .question-card:before{content:"";position:absolute;inset:18px;border:1px solid rgba(109,63,47,.11);border-radius:20px;pointer-events:none}
    .question-card:after{content:"";position:absolute;left:0;top:0;width:100%;height:5px;background:linear-gradient(90deg,var(--green) calc(var(--time-progress) * 100%),rgba(101,113,71,.12) 0);transition:background .12s linear}
    .level-seal{position:absolute;left:30px;top:28px;width:47px;height:47px;border:2px solid var(--red);color:var(--red);display:grid;place-items:center;transform:rotate(-5deg);font:800 13px/1 var(--sans);border-radius:5px;opacity:.84}
    .kanji-word{font:900 clamp(72px,9vw,148px)/1.12 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:.06em;text-align:center;max-width:100%;overflow-wrap:anywhere;text-shadow:0 2px 0 rgba(255,255,255,.7)}
    .kanji-word.is-long{font-size:clamp(55px,7vw,104px)}.kanji-word.is-very-long{font-size:clamp(43px,5.3vw,78px)}
    .meaning{min-height:26px;margin-top:24px;color:#969187;font-family:var(--cn);font-size:15px;font-weight:500;line-height:1.7;letter-spacing:.03em;text-align:center}
    .reading-guide{min-height:25px;margin-top:13px;color:var(--red-dark);font:700 15px/1.5 var(--sans);letter-spacing:.1em}
    .brush-feedback{position:absolute;z-index:8;left:max(28px,calc((100vw - min(1240px,74vw))/2));top:72px;width:190px;height:76px;pointer-events:none;opacity:0;transform:rotate(-5deg) scale(.8)}
    .brush-feedback.is-active{animation:feedback 1.05s ease both}
    .brush-feedback .stamp{position:absolute;inset:5px 14px;border:3px solid var(--red);border-radius:8px;color:var(--red);display:grid;place-items:center;background:rgba(251,248,240,.92);font:900 24px/1 var(--brush);box-shadow:0 5px 16px rgba(93,41,32,.12)}
    .brush-feedback small{display:block;font:800 11px/1.5 var(--sans);letter-spacing:.12em}
    @keyframes feedback{0%{opacity:0;transform:rotate(-13deg) scale(1.35)}18%{opacity:1;transform:rotate(-5deg) scale(1)}74%{opacity:1}100%{opacity:0;transform:rotate(-3deg) translateY(-8px)}}
    .answer-area{padding:0 max(170px,calc((100vw - 930px)/2)) 22px;position:relative;z-index:7}
    .answer-line{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:10px;margin-bottom:12px}
    .answer-display{height:59px;border:2px solid rgba(57,48,39,.22);background:rgba(255,253,248,.98);display:flex;align-items:center;justify-content:center;padding:0 20px;font:700 27px/1 var(--sans);letter-spacing:.12em;box-shadow:inset 0 2px 5px rgba(51,43,34,.05)}
    .answer-display .pending{color:#a29e94;font-size:.76em}.answer-display.is-correct{border-color:#68794c;color:#586a40}.answer-display.is-wrong{border-color:var(--red);color:var(--red)}
    .judge-button{border:0;background:var(--ink);color:#fff;font:800 16px/1 var(--sans);cursor:pointer}.judge-button:disabled{opacity:.38;cursor:default}
    .feedback-line{height:24px;text-align:center;font:700 14px/1.5 var(--sans);color:#77736a}.feedback-line.correct{color:#5f713f}.feedback-line.wrong{color:var(--red)}
    .romaji-keyboard{width:min(850px,100%);margin:0 auto;padding:10px;border-radius:16px;background:rgba(222,217,204,.96);box-shadow:0 8px 22px rgba(38,31,25,.15);display:flex;flex-direction:column;gap:7px;user-select:none}
    .key-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px}.key-row:nth-child(3){grid-template-columns:1.28fr repeat(7,minmax(0,1fr)) 1.28fr}
    .key{width:100%;height:44px;min-width:0;border:0;border-radius:8px;background:#fffdf8;box-shadow:0 3px 0 rgba(74,63,51,.18);font:700 18px/1 var(--sans);cursor:pointer}.key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,63,51,.18)}
    .key.function{background:#c9c7c3;font-size:19px}.key.long{font-family:var(--sans);font-size:19px}.key.shift-active{background:#fffdf8}.romaji-keyboard.disabled{pointer-events:none;opacity:.55}
    .corner-action{position:absolute;z-index:10;border:0;background:none;text-align:center;font:800 14px/1.35 var(--sans);cursor:pointer;padding:0;width:86px}.corner-action .circle{width:60px;height:60px;margin:0 auto 7px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:900 28px/1 var(--serif);position:relative}.corner-action .count{position:absolute;right:-7px;top:-8px;width:27px;height:27px;border:3px solid #fff;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font:800 13px/1 var(--sans);box-shadow:0 1px 5px rgba(0,0,0,.09)}
    .corner-action:disabled{opacity:.35;cursor:default}.exit-button{left:36px;bottom:28px}.skip-button{right:40px;bottom:108px}.hint-button{right:40px;bottom:24px}

    .ending-view{background:#171814;color:#f9f4e8}.ending-mark{text-align:center;opacity:0}.ending-view.is-active .ending-mark{animation:endMark .9s ease both}.ending-mark .slash{display:block;width:260px;height:5px;background:#f1eadc;transform:rotate(-8deg);margin-bottom:26px}.ending-mark strong{font:800 clamp(52px,9vw,110px)/1 var(--brush);letter-spacing:.12em}
    @keyframes endMark{0%{opacity:0;transform:scale(1.3)}25%{opacity:1;transform:scale(.96)}70%{opacity:1}100%{opacity:0;transform:scale(.9)}}

    .result-view{display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#f9f5e8 0 45%,#d8cfb9 100%);padding:30px}
    .result-scroll{width:min(710px,90vw);height:min(780px,90vh);position:relative;padding:62px 74px;background:linear-gradient(90deg,rgba(128,70,50,.04),transparent 10% 90%,rgba(128,70,50,.04)),#fffaf0;border-left:10px solid var(--wood-soft);border-right:10px solid var(--wood-soft);box-shadow:0 24px 60px rgba(43,32,24,.2);display:flex;align-items:center;justify-content:center;text-align:center;clip-path:inset(50% 0)}
    .result-view.unfurl .result-scroll{animation:unfurl .9s cubic-bezier(.16,1,.3,1) forwards}
    .result-scroll:before,.result-scroll:after{content:"";position:absolute;left:-22px;right:-22px;height:29px;background:linear-gradient(90deg,#2e1e19,#684638,#2b1d18);border-radius:13px}.result-scroll:before{top:-14px}.result-scroll:after{bottom:-14px}
    @keyframes unfurl{to{clip-path:inset(0)}}
    .result-content{opacity:0;transform:translateY(18px)}.result-view.unfurl .result-content{animation:resultIn .45s .62s ease forwards}@keyframes resultIn{to{opacity:1;transform:none}}
    .result-kicker{font:800 15px/1 var(--sans);letter-spacing:.28em;color:var(--red);margin-bottom:18px}.result-title{font:900 clamp(56px,9vw,92px)/1 var(--serif);margin:0 0 26px}.result-score{font:500 clamp(88px,15vw,150px)/1 var(--serif)}.result-score-label{font:700 17px/1 var(--sans);color:#777268;margin:8px 0 30px}
    .result-best{border:4px double rgba(83,59,45,.52);padding:15px;font:700 15px/1 var(--sans);color:#706b63}.result-best strong{font:500 38px/1 var(--serif);color:var(--ink);margin:0 8px}
    .result-actions{margin-top:28px;display:grid;gap:12px}.result-actions .primary-button{height:72px}.result-actions .text-button{margin-top:8px}
    #againButton{position:relative;text-align:center}#againButton .arrow{position:absolute;right:24px;top:50%;margin:0;transform:translateY(-50%)}
    .new-record{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}.result-view.new-best .new-record{animation:newRecord 1.5s 1s ease both}.new-record span{width:220px;height:100px;border:5px solid var(--red);color:var(--red);display:grid;place-items:center;font:900 35px/1 var(--brush);transform:rotate(-7deg);background:rgba(255,250,240,.88)}
    @keyframes newRecord{0%{opacity:0;transform:scale(1.6) rotate(-10deg)}18%,70%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(.94)}}

    .modal{position:fixed;z-index:60;inset:0;background:rgba(24,20,17,.48);display:grid;place-items:center;padding:24px}.modal-card{width:min(680px,94vw);max-height:min(780px,92dvh);overflow:auto;background:var(--paper);border:8px solid var(--wood);padding:34px 38px;box-shadow:0 28px 70px rgba(0,0,0,.28)}
    .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.modal-title{font:900 31px/1 var(--serif);margin:0}.close-button{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#fffaf0;font:700 24px/1 var(--sans);cursor:pointer}
    .setting-group{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}.setting-label{display:block;font:800 15px/1 var(--sans);letter-spacing:.12em;color:var(--red-dark);margin-bottom:12px}.chip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.chip input{position:absolute;opacity:0;pointer-events:none}.chip span{height:52px;border:1px solid rgba(59,49,39,.2);background:#fffdf7;display:flex;align-items:center;justify-content:center;font:800 14px/1 var(--sans);cursor:pointer}.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}.mode-grid{grid-template-columns:1fr 1fr}.setting-note{font:500 13px/1.7 var(--sans);color:#827d74;margin:10px 0 0}.settings-error{height:22px;color:var(--red);font:700 13px/1.5 var(--sans);margin-top:12px}.modal-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:18px}.secondary-button{height:58px;border:1px solid rgba(55,45,36,.24);background:#fffdf8;font:800 15px/1 var(--sans);cursor:pointer}.save-button{height:58px;border:0;background:var(--ink);color:#fff;font:800 15px/1 var(--sans);cursor:pointer}
    .how-card p{font:500 16px/2 var(--sans);color:#656158;margin:0 0 12px}.how-card strong{color:var(--ink)}

    @media(max-width:820px){
      body{background:var(--paper)}
      .room-bg{background:var(--paper)}.room-bg:after{display:none}
      .home-view{padding:0;align-items:stretch}.home-layout{display:block;width:100%;height:100%}.home-mascot{display:none}
      .scroll-panel{width:100%;height:100%;max-height:none;border:0;box-shadow:none;padding:70px 28px 34px;justify-content:center}.scroll-panel:before,.scroll-panel:after{display:none}
      .settings-button{top:max(16px,env(safe-area-inset-top));right:16px;width:52px;height:52px}.settings-button svg{width:29px;height:29px}
      .home-kicker{font-size:12px;margin-bottom:15px}.home-title{font-size:clamp(54px,17vw,74px)}.home-subtitle{font-size:14px;margin:15px 0 27px}.home-description{font-size:14px;line-height:1.85;margin-bottom:28px;max-width:330px}
      .primary-button{height:68px;font-size:18px}.best-plaque{height:62px;margin-top:12px}.best-plaque strong{font-size:36px}.text-button{margin-top:21px;font-size:15px}
      .practice-view{border-width:2px}.practice-shell{grid-template-rows:58px minmax(0,1fr) auto}
      .hud{width:calc(100% - 32px);font-size:11px}.hud-item{gap:5px;letter-spacing:.02em}.hud-item strong{font-size:22px}.hud-item small{font-size:9px}
      .question-zone{padding:48px 18px 12px;align-items:stretch}.question-card{width:100%;height:100%;min-height:0;border-radius:21px;padding:44px 25px 34px;transform:scale(calc(.96 + var(--approach) * .035));transform-origin:center center}
      .question-card:before{inset:11px;border-radius:15px}.level-seal{left:19px;top:18px;width:38px;height:38px;font-size:10px}
      .kanji-word{font-size:clamp(56px,18vw,84px);letter-spacing:.05em}.kanji-word.is-long{font-size:clamp(43px,13vw,64px)}.kanji-word.is-very-long{font-size:clamp(34px,10vw,50px)}
      .meaning{font-size:12px;line-height:1.55;margin-top:18px;min-height:20px}.reading-guide{font-size:12px;margin-top:9px;min-height:18px}
      .brush-feedback{left:12px;top:54px;width:124px;height:55px}.brush-feedback .stamp{inset:4px 8px;border-width:2px;font-size:18px}.brush-feedback small{font-size:8px}
      .answer-area{padding:0 10px max(8px,env(safe-area-inset-bottom))}.answer-line{grid-template-columns:minmax(0,1fr) 78px;gap:7px;margin-bottom:7px}.answer-display{height:48px;font-size:22px;padding:0 8px}.judge-button{font-size:13px}.feedback-line{height:19px;font-size:11px}
      .romaji-keyboard{padding:8px 6px;gap:7px;border-radius:16px}.key-row{gap:6px}.key{height:clamp(42px,11vw,48px);border-radius:8px;font-size:17px}.key.function{font-size:20px}.key.long{font-size:20px}
      .corner-action{position:relative;left:auto!important;right:auto!important;bottom:auto!important;width:auto;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;background:rgba(255,253,248,.9);border-radius:12px;height:46px}
      .corner-action .circle{width:34px;height:34px;margin:0;font-size:17px}.corner-action .count{width:19px;height:19px;border-width:2px;right:-6px;top:-5px;font-size:9px}
      .mobile-actions{display:grid!important;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:7px}.exit-button,.skip-button,.hint-button{position:relative}
      .modal{padding:12px}.modal-card{border-width:5px;padding:26px 20px;max-height:94dvh}.modal-title{font-size:26px}.chip-grid{grid-template-columns:repeat(3,1fr);gap:7px}.chip span{height:46px;font-size:12px}.mode-grid{grid-template-columns:1fr 1fr}
      .result-view{padding:22px}.result-scroll{width:94vw;height:88dvh;padding:48px 31px;border-width:7px}.result-scroll:before,.result-scroll:after{left:-16px;right:-16px}.result-title{font-size:57px}.result-score{font-size:92px}
    }
    @media(min-width:821px){
      .mobile-actions{display:contents}
      .practice-view .romaji-keyboard{display:none}
      .practice-view .answer-area{padding-bottom:34px}
      .home-view{padding:clamp(42px,6vw,82px) clamp(28px,6vw,86px) clamp(80px,9vw,120px)}

    const typeLabels = {
      category: ['敬', '敬語分類'],
      'special-base': ['特', '特殊動詞'],
      conversion: ['換', '敬語変換'],
      actor: ['主', '主体判断'],
      construction: ['型', '構式補全']
    };
    const [seal, label] = typeLabels[question.type] || ['敬', '敬語問題'];
    $('levelSeal').textContent = seal;
    $('questionType').textContent = label;
    $('instruction').textContent = question.instruction;
    $('feedbackLine').textContent = '';
    $('feedbackLine').className = 'keigo-feedback';
    $('questionCard').style.setProperty('--approach', '0');
    renderExpression(question);
    const grid = $('choiceGrid');
    grid.className = `choice-grid${question.type === 'category' ? ' is-category' : ' is-special'}`;
    grid.replaceChildren();
    game.options.forEach((option, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'choice-button';
      button.dataset.key = option.key;
      const choiceIndex = document.createElement('span');
      choiceIndex.className = 'choice-index';
      choiceIndex.textContent = String(index + 1);
      const choiceText = document.createElement('span');
      choiceText.textContent = option.text;
      button.append(choiceIndex, choiceText);
      button.addEventListener('click', () => checkAnswer(option.key, button));
      grid.appendChild(button);
    });
    noteDraw(question);
    updateHud();
  }

  function recordResult(question, result, elapsed) {
    if (settings.mode !== 'study') return;
    const stat = history[question.skillKey] || { correct: 0, wrong: 0, hint: 0, skip: 0, avg: 0 };
    stat[result] = (stat[result] || 0) + 1;
    if (elapsed) stat.avg = stat.avg ? Math.round(stat.avg * .7 + elapsed * .3) : elapsed;
    history[question.skillKey] = stat;
    saveObject(HISTORY_KEY, history);
  }

  function showScore(points) {
    clearTimeout(game.feedback);
    $('brushText').firstChild.textContent = game.streak >= 10 ? '無双' : game.streak >= 5 ? '鮮烈' : game.streak >= 3 ? '連破' : '見事';
    $('brushScore').textContent = `＋${points}`;
    const feedback = $('brushFeedback');
    feedback.classList.remove('is-active');
    void feedback.offsetWidth;
    feedback.classList.add('is-active');
    game.feedback = setTimeout(() => feedback.classList.remove('is-active'), 1100);
  }

  function lockChoices() { $('choiceGrid').classList.add('is-locked'); [...$('choiceGrid').querySelectorAll('.choice-button')].forEach((button) => { button.disabled = true; }); }
  function correctOptionText(question) { return question.options.find((option) => option.key === question.answerKey)?.text || ''; }

  function checkAnswer(key, selectedButton) {
    if (game.answered || !game.current) return;
    const question = game.current;
    const elapsed = Math.max(0, Date.now() - game.questionStartedAt);
    const correct = key === question.answerKey;
    game.answered = true;
    lockChoices();
    const correctButton = $('choiceGrid').querySelector(`[data-key="${CSS.escape(question.answerKey)}"]`);
    correctButton?.classList.add('is-correct');
    game.lastCorrectPosition = game.options.findIndex((option) => option.key === question.answerKey);
    if (correct) {
      window.CottageArcade?.correct();
      game.streak++;
      const seconds = Math.floor(elapsed / 1000);
      const timeBonus = Math.max(0, TIME_WINDOW - seconds) * TIME_STEP;
      const chainBonus = Math.min((game.streak - 1) * STREAK_STEP, MAX_STREAK);
      const points = BASE + timeBonus + chainBonus;
      game.score += points;
      $('feedbackLine').textContent = `正解　＋${points}点`;
      $('feedbackLine').className = 'keigo-feedback correct';
      recordResult(question, 'correct', elapsed);
      showScore(points);
      updateHud();
      game.advance = setTimeout(nextQuestion, 760);
      return;
    }
    window.CottageArcade?.wrong();
    game.streak = 0;
    selectedButton?.classList.add('is-wrong');
    $('feedbackLine').textContent = `正解：${correctOptionText(question)}　${question.explanation}`;
    $('feedbackLine').className = 'keigo-feedback wrong';
    recordResult(question, 'wrong', elapsed);
    updateHud();
    game.advance = setTimeout(nextQuestion, 900);
  }

  function noteDraw(question) {
    game.drawCounts.type[question.type] = (game.drawCounts.type[question.type] || 0) + 1;
    game.drawCounts.keigoClass[question.keigoClass] = (game.drawCounts.keigoClass[question.keigoClass] || 0) + 1;
  }
  function leastUsed(candidates, dimension, keyFor) { const counts = game.drawCounts[dimension]; const minimum = Math.min(...candidates.map((question) => counts[keyFor(question)] || 0)); return candidates.filter((question) => (counts[keyFor(question)] || 0) === minimum); }
  function chooseQuestion() {
    const recentIds = new Set(game.recent);
    let candidates = game.pool.filter((question) => !recentIds.has(question.id));
    if (!candidates.length) candidates = game.pool;
    candidates = leastUsed(candidates, 'type', (question) => question.type);
    candidates = leastUsed(candidates, 'keigoClass', (question) => question.keigoClass);
    const weighted = candidates.map((question) => {
      let weight = 1;
      if (settings.mode === 'study') {
        const stat = history[question.skillKey] || {};
        weight = Math.max(.25, 1 + (stat.wrong || 0) * 3 + (stat.hint || 0) * 2 + (stat.skip || 0) * 2 + Math.min(3, (stat.avg || 0) / 5000) - Math.min(.7, (stat.correct || 0) * .05));
      }
      return [question, weight];
    });
    let roll = Math.random() * weighted.reduce((sum, item) => sum + item[1], 0);
    for (const [question, weight] of weighted) { roll -= weight; if (roll <= 0) return question; }
    return weighted[weighted.length - 1][0];
  }

  function nextQuestion() {
    clearTimeout(game.advance);
    game.advance = 0;
    if (game.current) { game.recent.push(game.current.id); if (game.recent.length > 5) game.recent.shift(); }
    game.current = chooseQuestion();
    renderQuestion();
  }

  function showHint() {
    if (game.answered || game.hints <= 0 || game.hintUsed || !game.current) return;
    game.hints--;
    game.hintUsed = true;
    const wrongButtons = shuffle([...$('choiceGrid').querySelectorAll('.choice-button')].filter((button) => button.dataset.key !== game.current.answerKey));
    const eliminateCount = game.current.type === 'category' ? 1 : Math.min(2, wrongButtons.length);
    wrongButtons.slice(0, eliminateCount).forEach((button) => { button.disabled = true; button.classList.add('is-eliminated'); });
    $('feedbackLine').textContent = eliminateCount === 1 ? '错误选项已排除。' : '两个错误选项已排除。';
    recordResult(game.current, 'hint');
    updateHud();
  }

  function skipQuestion() {
    if (game.answered || game.skips <= 0 || !game.current) return;
    game.skips--;
    game.streak = 0;
    recordResult(game.current, 'skip');
    updateHud();
    nextQuestion();
  }

  function updateTimer() {
    if (game.view !== 'practice') return;
    const now = Date.now();
    const remaining = Math.max(0, game.endsAt - now);
    const seconds = remaining / 1000;
    $('timeLeft').textContent = seconds.toFixed(1);
    $('timerWrap').classList.toggle('is-urgent', seconds <= 10);
    const approach = Math.min(1, (now - game.questionStartedAt) / 10000);
    const progress = Math.min(1, (DURATION - remaining) / DURATION);
    $('questionCard').style.setProperty('--approach', approach.toFixed(3));
    $('questionCard').style.setProperty('--time-progress', progress.toFixed(4));
    if (now >= game.endsAt) finishGame();
  }

  function beginGame() {
    window.CottageArcade?.start();
    game.pool = buildPool();
    if (!game.pool.length) { setView('home'); return; }
    game.current = null;
    game.score = 0;
    game.streak = 0;
    game.hints = MAX_HINTS;
    game.skips = MAX_SKIPS;
    game.recent = [];
    game.drawCounts = { type: {}, keigoClass: {} };
    game.lastCorrectPosition = -1;
    game.endsAt = Date.now() + DURATION;
    setView('practice');
    nextQuestion();
    clearInterval(game.timer);
    game.timer = setInterval(updateTimer, 50);
    updateTimer();
  }

  function startCountdown() {
    clearInterval(game.timer);
    clearInterval(game.countdown);
    clearTimeout(game.advance);
    setView('countdown');
    $('countdownReady').textContent = 'よーい';
    let count = 3;
    $('countdownNumber').textContent = '3';
    $('countdownNumber').className = 'countdown-number is-pop';
    game.countdown = setInterval(() => {
      count--;
      if (count > 0) {
        $('countdownNumber').classList.remove('is-pop');
        void $('countdownNumber').offsetWidth;
        $('countdownNumber').textContent = String(count);
        $('countdownNumber').classList.add('is-pop');
      } else {
        clearInterval(game.countdown);
        $('countdownReady').textContent = '';
        $('countdownNumber').textContent = 'はじめ！';
        $('countdownNumber').className = 'countdown-number is-start is-pop';
        setTimeout(beginGame, 560);
      }
    }, 1000);
  }

  function prepareRecordEffect(isNew) {
    $('resultBestLabel').textContent = isNew ? '新記録' : '自己最高';
    $('resultBestPanel').classList.toggle('is-new', isNew);
    const particles = $('recordParticles');
    particles.replaceChildren();
    if (!isNew) return;
    const fragment = document.createDocumentFragment();
    for (let index = 0; index < 42; index++) {
      const drop = document.createElement('i');
      const angle = ((360 / 42) * index) + ((index % 4) - 1.5) * 4;
      const size = 4 + (index % 5) * 1.55;
      drop.className = `record-drop${index % 5 === 0 ? ' is-red' : index % 3 === 0 ? ' is-gold' : ''}${index % 4 === 0 ? ' is-round' : ''}`;
      drop.style.setProperty('--record-angle', `${angle}deg`);
      drop.style.setProperty('--record-distance', `${126 + (index % 7) * 23}px`);
      drop.style.setProperty('--record-size', `${size}px`);
      drop.style.setProperty('--record-delay', `${80 + (index % 6) * 18}ms`);
      fragment.appendChild(drop);
    }
    particles.appendChild(fragment);
  }

  function finishGame() {
    if (game.view !== 'practice') return;
    window.CottageArcade?.finish();
    clearInterval(game.timer);
    clearTimeout(game.advance);
    clearTimeout(game.recordTimer);
    const isNew = game.score > best;
    if (isNew) { best = game.score; try { localStorage.setItem(BEST_KEY, String(best)); } catch {} }
    $('resultScore').textContent = String(game.score);
    $('resultBest').textContent = String(best);
    $('resultKicker').textContent = isNew ? '自己最高を更新' : '百二十秒の稽古';
    $('resultTitle').textContent = isNew ? '新記録' : '稽古終了';
    prepareRecordEffect(isNew);
    setView('ending');
    $('endingView').classList.remove('is-active');
    void $('endingView').offsetWidth;
    $('endingView').classList.add('is-active');
    setTimeout(() => {
      setView('result');
      const view = $('resultView');
      view.className = 'view result-view is-unfurling';
      void view.offsetWidth;
      if (isNew && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) game.recordTimer = setTimeout(() => view.classList.add('is-new-record'), 1200);
    }, 900);
  }

  function returnHome() {
    window.CottageArcade?.cancel();
    clearInterval(game.timer);
    clearInterval(game.countdown);
    clearTimeout(game.advance);
    clearTimeout(game.recordTimer);
    $('homeBest').textContent = String(best);
    setView('home');
  }

  function renderSettings() {
    document.querySelectorAll('input[name="content"]').forEach((input) => { input.checked = settings.contents.includes(input.value); });
    document.querySelectorAll('input[name="target"]').forEach((input) => { input.checked = settings.targets.includes(input.value); });
    const mode = document.querySelector(`input[name="mode"][value="${settings.mode}"]`);
    if (mode) mode.checked = true;
  }

  function saveSettings(event) {
    event.preventDefault();
    const candidate = { contents: selectedValues('content'), targets: selectedValues('target'), mode: document.querySelector('input[name="mode"]:checked')?.value || 'random' };
    if (!candidate.contents.length || !candidate.targets.length) { $('settingsError').textContent = '内容と種類を一つ以上選んでください。'; return; }
    if (!buildPool(candidate).length) { $('settingsError').textContent = 'この組み合わせには問題がありません。'; return; }
    settings = candidate;
    saveObject(SETTINGS_KEY, settings);
    closeModal('settingsModal');
  }

  $('homeBest').textContent = String(best);
  renderSettings();
  $('startButton').onclick = startCountdown;
  $('againButton').onclick = startCountdown;
  $('homeButton').onclick = returnHome;
  $('exitButton').onclick = returnHome;
  $('hintButton').onclick = showHint;
  $('skipButton').onclick = skipQuestion;
  $('settingsButton').onclick = () => { renderSettings(); $('settingsError').textContent = ''; openModal('settingsModal'); };
  $('settingsClose').onclick = () => closeModal('settingsModal');
  $('settingsForm').onsubmit = saveSettings;
  $('settingsReset').onclick = () => { document.querySelectorAll('#settingsForm input[type="checkbox"]').forEach((input) => { input.checked = true; }); $('settingsError').textContent = ''; };
  $('settingsModal').addEventListener('click', (event) => { if (event.target === $('settingsModal')) closeModal('settingsModal'); });
  document.addEventListener('keydown', (event) => {
    if (!$('settingsModal').hidden && event.key === 'Escape') { closeModal('settingsModal'); return; }
    if (game.view !== 'practice') return;
    if (/^[1-4]$/.test(event.key)) {
      const button = $('choiceGrid').querySelectorAll('.choice-button')[Number(event.key) - 1];
      if (button && !button.disabled) { event.preventDefault(); button.click(); }
    } else if (event.key === 'Escape') { event.preventDefault(); returnHome(); }
  });
})();
  </script>
</body>
